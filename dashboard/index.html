<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDC Multicam</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --panel-2: #eef0f3; --text: #14161a; --muted: #5f6672;
    --line: #d9dde3; --rec: #d92d20; --ok: #12875a; --warn: #b7791f; --accent: #2457d6;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1114; --panel: #181b20; --panel-2: #20242b; --text: #eceef2; --muted: #98a0ad;
      --line: #2b3038; --rec: #ff5a4d; --ok: #3ccf91; --warn: #f2b84b; --accent: #7aa2ff;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1114; --panel: #181b20; --panel-2: #20242b; --text: #eceef2; --muted: #98a0ad;
    --line: #2b3038; --rec: #ff5a4d; --ok: #3ccf91; --warn: #f2b84b; --accent: #7aa2ff; --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header.top {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .4px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--line);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.rec { color: var(--rec); border-color: var(--rec); }
  .pill.rec .dot { background: var(--rec); animation: pulse 1s infinite; }
  .pill.idle { color: var(--ok); border-color: var(--ok); }
  .pill.idle .dot { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pill.rec .dot { animation: none; } }
  button {
    font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 40px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 700; }
  button.ghost { background: transparent; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; min-width: 76px; text-align: right; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .card.is-rec { border-color: var(--rec); }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
  .card-h b { font-size: 15px; }
  .view { position: relative; background: #000; width: min(100%, 340px); margin: 0 auto; aspect-ratio: 9 / 16; max-height: 62vh; }
  .view canvas, .view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .view .off {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    color: #aab; background: rgba(0,0,0,.72); padding: 20px; font-size: 14px;
  }
  .card.is-off .view .off { display: flex; }
  .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
  .recbadge { position: absolute; top: 8px; right: 8px; display: none; align-items: center; gap: 6px; background: rgba(0,0,0,.6); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 9px; border-radius: 6px; }
  .recbadge i { width: 9px; height: 9px; border-radius: 50%; background: #ff4d3d; animation: pulse 1s infinite; }
  .card.is-rec .recbadge { display: inline-flex; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px 4px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat span { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 12px 14px 14px; flex-wrap: wrap; }
  .pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
  .pad button { padding: 0; min-height: 44px; font-size: 18px; }
  .pad .home { font-size: 13px; }
  .pos { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .btns { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px; }
  .log { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .log h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  .log ol { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
  .log li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log li time { color: var(--muted); margin-right: 8px; }
  footer { color: var(--muted); font-size: 12px; padding: 14px 4px; }
  @media (max-width: 480px) { .wrap { padding: 12px; } .timer { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>GDC Multicam</h1>
      <div class="sub">Dashboard riprese · <span id="mode">modalità simulazione</span></div>
    </div>
    <div class="row">
      <span class="pill" id="globalPill"><span class="dot"></span><span id="globalTxt">FERMO</span></span>
      <span class="timer" id="globalTimer" aria-live="off">00:00</span>
      <button class="primary" id="recAll" title="Scorciatoia: tasto R">● REC tutte</button>
      <button id="stopAll" disabled>■ STOP tutte</button>
    </div>
  </header>

  <main class="grid" id="cams"></main>

  <section class="log" aria-label="Registro eventi">
    <h2>Registro</h2>
    <ol id="log"></ol>
  </section>
  <footer>
    Prototipo: stream, stato e movimenti sono simulati. I comandi passano da un livello di trasporto
    (<code>transport</code>) che sostituiremo con la connessione reale alle camere.
  </footer>
</div>

<script>
"use strict";
/* ===== Configurazione camere ===== */
const CAMERAS = [
  { id: "A", name: "CAM A", device: "iPhone XR" },
  { id: "B", name: "CAM B", device: "Secondo telefono" },
];
const PAN_LIMIT = 90, TILT_LIMIT = 45, STEP = 5;

/* ===== Trasporto =====
   Interfaccia: transport.send(camId, command) e transport.onState(callback(camId, partialState)).
   Comandi: connect | disconnect | rec_start | rec_stop | move {pan,tilt} | home
   Il MockTransport simula le camere. Più avanti: WebSocketTransport verso l'hub/ESP32. */
class MockTransport {
  constructor() { this.cb = () => {}; this.s = {}; }
  onState(cb) { this.cb = cb; }
  init(cams) {
    cams.forEach((c, i) => {
      this.s[c.id] = { online: false, rec: false, recStart: 0, battery: 100 - i * 17, freeGb: 48 - i * 21, pan: 0, tilt: 0 };
    });
    setTimeout(() => this.send("A", { cmd: "connect" }), 600);
    setInterval(() => this.tick(), 1000);
  }
  push(id) { this.cb(id, { ...this.s[id] }); }
  tick() {
    for (const id in this.s) {
      const st = this.s[id];
      if (!st.online) continue;
      if (st.rec) { st.freeGb = Math.max(0, +(st.freeGb - 0.04).toFixed(2)); if (Math.random() < .2) st.battery = Math.max(1, st.battery - 1); }
      this.push(id);
    }
  }
  send(id, m) {
    const st = this.s[id]; if (!st) return;
    const clamp = (v, l) => Math.max(-l, Math.min(l, v));
    switch (m.cmd) {
      case "connect": st.online = true; break;
      case "disconnect": st.online = false; st.rec = false; break;
      case "rec_start": if (st.online && !st.rec) { st.rec = true; st.recStart = Date.now(); } break;
      case "rec_stop": if (st.rec) st.rec = false; break;
      case "move": if (st.online) { st.pan = clamp(st.pan + (m.pan || 0), PAN_LIMIT); st.tilt = clamp(st.tilt + (m.tilt || 0), TILT_LIMIT); } break;
      case "home": st.pan = 0; st.tilt = 0; break;
    }
    this.push(id);
  }
}
const transport = new MockTransport();

/* ===== Stato UI ===== */
const state = {}; // id -> ultimo stato ricevuto
const $ = (s, r = document) => r.querySelector(s);
const fmtTime = (ms) => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const stamp = () => new Date().toLocaleTimeString("it-IT");

function log(msg) {
  const li = document.createElement("li");
  li.innerHTML = "<time>" + stamp() + "</time>";
  li.append(msg);
  const ol = $("#log"); ol.prepend(li);
  while (ol.children.length > 60) ol.lastChild.remove();
}

/* ===== Costruzione card ===== */
const cards = {};
function buildCard(cam) {
  const el = document.createElement("article");
  el.className = "card is-off";
  el.innerHTML = `
    <div class="card-h">
      <div><b>${cam.name}</b> <span class="sub">${cam.device}</span></div>
      <span class="pill" data-k="pill"><span class="dot"></span><span data-k="pillTxt">OFFLINE</span></span>
    </div>
    <div class="view">
      <canvas data-k="canvas" width="360" height="640"></canvas>
      <video data-k="video" muted playsinline hidden></video>
      <span class="tag">ANTEPRIMA SIMULATA</span>
      <span class="recbadge"><i></i><span data-k="badgeTime">00:00</span></span>
      <div class="off">Camera non connessa.<br>Apri la pagina camera sul telefono per collegarla.</div>
    </div>
    <div class="stats">
      <div class="stat"><small>Batteria</small><span data-k="bat">—</span></div>
      <div class="stat"><small>Spazio libero</small><span data-k="free">—</span></div>
      <div class="stat"><small>Pan / Tilt</small><span data-k="pos">—</span></div>
    </div>
    <div class="ctl">
      <div class="btns">
        <button class="primary" data-k="rec">● REC</button>
        <button data-k="stop" disabled>■ STOP</button>
        <button class="ghost" data-k="conn">Connetti (sim)</button>
        <button class="ghost" data-k="web">Usa webcam di questo PC</button>
      </div>
      <div>
        <div class="pad" role="group" aria-label="Movimento ${cam.name} (segnaposto)">
          <span></span><button data-m="0,${STEP}" aria-label="Su">▲</button><span></span>
          <button data-m="-${STEP},0" aria-label="Sinistra">◀</button><button class="home" data-k="home">⌂</button><button data-m="${STEP},0" aria-label="Destra">▶</button>
          <span></span><button data-m="0,-${STEP}" aria-label="Giù">▼</button><span></span>
        </div>
        <div class="pos" style="text-align:center;margin-top:4px">movimenti: segnaposto</div>
      </div>
    </div>`;
  const k = (n) => $(`[data-k="${n}"]`, el);
  const ui = { el, canvas: k("canvas"), video: k("video"), pill: k("pill"), pillTxt: k("pillTxt"),
    bat: k("bat"), free: k("free"), pos: k("pos"), rec: k("rec"), stop: k("stop"), conn: k("conn"), badgeTime: k("badgeTime"), web: k("web") };
  ui.rec.onclick = () => command(cam.id, { cmd: "rec_start" });
  ui.stop.onclick = () => command(cam.id, { cmd: "rec_stop" });
  ui.conn.onclick = () => command(cam.id, { cmd: state[cam.id]?.online ? "disconnect" : "connect" });
  k("home").onclick = () => command(cam.id, { cmd: "home" });
  el.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => {
    const [pan, tilt] = b.dataset.m.split(",").map(Number);
    command(cam.id, { cmd: "move", pan, tilt });
  });
  ui.web.onclick = () => toggleWebcam(cam, ui);
  cards[cam.id] = ui;
  $("#cams").append(el);
}

async function toggleWebcam(cam, ui) {
  if (ui.video.srcObject) {
    ui.video.srcObject.getTracks().forEach((t) => t.stop());
    ui.video.srcObject = null; ui.video.hidden = true; ui.canvas.hidden = false;
    ui.web.textContent = "Usa webcam di questo PC"; return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true });
    ui.video.srcObject = s; await ui.video.play(); ui.video.hidden = false; ui.canvas.hidden = true;
    ui.web.textContent = "Torna all'anteprima simulata";
    $(".tag", ui.el).textContent = "WEBCAM LOCALE (TEST)";
  } catch (e) { log(cam.name + ": webcam non disponibile (" + (e.name || "errore") + ")"); }
}

/* ===== Comandi e aggiornamenti ===== */
function command(id, m) {
  const cam = CAMERAS.find((c) => c.id === id);
  if (m.cmd === "rec_start") log(cam.name + ": REC avviato");
  if (m.cmd === "rec_stop") log(cam.name + ": REC fermato");
  if (m.cmd === "connect") log(cam.name + ": connessa (simulazione)");
  if (m.cmd === "disconnect") log(cam.name + ": disconnessa");
  transport.send(id, m);
}

transport.onState((id, st) => { state[id] = st; render(id); renderGlobal(); });

function render(id) {
  const st = state[id], ui = cards[id]; if (!st) return;
  ui.el.classList.toggle("is-off", !st.online);
  ui.el.classList.toggle("is-rec", st.rec);
  ui.pill.className = "pill " + (!st.online ? "" : st.rec ? "rec" : "idle");
  ui.pillTxt.textContent = !st.online ? "OFFLINE" : st.rec ? "IN REC" : "PRONTA";
  ui.bat.textContent = st.online ? st.battery + "%" : "—";
  ui.free.textContent = st.online ? st.freeGb.toFixed(1) + " GB" : "—";
  ui.pos.textContent = st.online ? st.pan + "° / " + st.tilt + "°" : "—";
  ui.rec.disabled = !st.online || st.rec;
  ui.stop.disabled = !st.rec;
  ui.conn.textContent = st.online ? "Disconnetti (sim)" : "Connetti (sim)";
}

function renderGlobal() {
  const all = Object.values(state);
  const online = all.filter((s) => s.online), recs = all.filter((s) => s.rec);
  $("#recAll").disabled = !online.length || recs.length === online.length;
  $("#stopAll").disabled = !recs.length;
  const pill = $("#globalPill");
  pill.className = "pill " + (recs.length ? "rec" : online.length ? "idle" : "");
  $("#globalTxt").textContent = recs.length ? `IN REC (${recs.length}/${online.length})` : online.length ? `PRONTE (${online.length}/${CAMERAS.length})` : "NESSUNA CAMERA";
}

$("#recAll").onclick = () => CAMERAS.forEach((c) => state[c.id]?.online && !state[c.id].rec && command(c.id, { cmd: "rec_start" }));
$("#stopAll").onclick = () => CAMERAS.forEach((c) => state[c.id]?.rec && command(c.id, { cmd: "rec_stop" }));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.toLowerCase() === "r") { const b = $("#recAll").disabled ? $("#stopAll") : $("#recAll"); if (!b.disabled) b.click(); }
});

/* Timer (REC più lungo in corso) */
setInterval(() => {
  const now = Date.now();
  const recs = Object.values(state).filter((s) => s.rec);
  $("#globalTimer").textContent = recs.length ? fmtTime(now - Math.min(...recs.map((s) => s.recStart))) : "00:00";
  for (const id in cards) cards[id].badgeTime.textContent = state[id]?.rec ? fmtTime(now - state[id].recStart) : "00:00";
}, 250);

/* ===== Anteprima simulata (reagisce a pan/tilt) ===== */
function drawPreview(t) {
  for (const cam of CAMERAS) {
    const ui = cards[cam.id], c = ui.canvas; if (c.hidden) continue;
    const g = c.getContext("2d"), W = c.width, H = c.height, st = state[cam.id] || { pan: 0, tilt: 0 };
    const ox = (st.pan / PAN_LIMIT) * -120, oy = (st.tilt / TILT_LIMIT) * 120;
    const hue = cam.id === "A" ? 215 : 160;
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsl(${hue} 35% 22%)`); grad.addColorStop(1, `hsl(${hue + 30} 30% 10%)`);
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
    for (let x = -60; x < W + 60; x += 60) { g.beginPath(); g.moveTo(x + (ox % 60), 0); g.lineTo(x + (ox % 60), H); g.stroke(); }
    for (let y = -60; y < H + 60; y += 60) { g.beginPath(); g.moveTo(0, y + (oy % 60)); g.lineTo(W, y + (oy % 60)); g.stroke(); }
    const bx = W / 2 + ox + Math.sin(t / 900) * 40, by = H / 2 + oy + Math.cos(t / 1300) * 30;
    g.fillStyle = `hsl(${hue + 120} 70% 62%)`; g.beginPath(); g.arc(bx, by, 34, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,.35)"; g.setLineDash([6, 6]);
    g.strokeRect(W * .1, H * .08, W * .8, H * .84); g.setLineDash([]);
    g.fillStyle = "rgba(255,255,255,.85)"; g.font = "600 15px sans-serif";
    g.fillText(cam.name + " · 9:16", 14, H - 34); g.font = "13px monospace";
    g.fillText(new Date().toLocaleTimeString("it-IT"), 14, H - 14);
  }
  requestAnimationFrame(drawPreview);
}

/* ===== Avvio ===== */
CAMERAS.forEach(buildCard);
transport.init(CAMERAS);
renderGlobal();
requestAnimationFrame(drawPreview);
log("Dashboard avviata (simulazione)");
</script>
</body>
</html>
