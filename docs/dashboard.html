<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDC Multicam</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --panel-2: #eef0f3; --text: #14161a; --muted: #5f6672;
    --line: #d9dde3; --rec: #d92d20; --ok: #12875a; --warn: #b7791f; --accent: #2457d6; --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1114; --panel: #181b20; --panel-2: #20242b; --text: #eceef2; --muted: #98a0ad;
      --line: #2b3038; --rec: #ff5a4d; --ok: #3ccf91; --warn: #f2b84b; --accent: #7aa2ff; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1114; --panel: #181b20; --panel-2: #20242b; --text: #eceef2; --muted: #98a0ad;
    --line: #2b3038; --rec: #ff5a4d; --ok: #3ccf91; --warn: #f2b84b; --accent: #7aa2ff; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.rec { color: var(--rec); border-color: var(--rec); } .pill.rec .dot { background: var(--rec); animation: pulse 1s infinite; }
  .pill.idle { color: var(--ok); border-color: var(--ok); } .pill.idle .dot { background: var(--ok); }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pill.rec .dot, .recbadge i { animation: none !important; } }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 40px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 700; }
  button.ghost { background: transparent; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; min-width: 76px; text-align: right; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .tile small { display: block; color: var(--muted); font-size: 12px; }
  .tile b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .card.is-rec { border-color: var(--rec); }
  .card.click { cursor: pointer; } .card.click:hover { border-color: var(--muted); }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
  .card-h b { font-size: 15px; }
  .card-b { display: flex; gap: 14px; padding: 0 14px 12px; }
  .info { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .kv small { display: block; color: var(--muted); font-size: 11px; }
  .kv span { font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-f { display: flex; gap: 8px; padding: 0 14px 14px; flex-wrap: wrap; }
  .card-f button { flex: 1; }
  .add { display: flex; align-items: center; justify-content: center; min-height: 160px; border: 2px dashed var(--line); background: transparent; color: var(--muted); border-radius: 14px; cursor: pointer; font: inherit; }
  .view { position: relative; background: #000; aspect-ratio: 9 / 16; overflow: hidden; border-radius: 8px; }
  .view.mini { width: 104px; flex: none; }
  .view.big { width: min(100%, 340px); margin: 0 auto; max-height: 62vh; }
  .view canvas, .view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .view .off { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #aab; background: rgba(0,0,0,.72); padding: 10px; font-size: 12px; }
  .is-off .view .off { display: flex; }
  .tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 5px; }
  .view.mini .tag { display: none; }
  .card-f .ghost { flex: 0 0 auto; }
  .recbadge { position: absolute; top: 6px; right: 6px; display: none; align-items: center; gap: 5px; background: rgba(0,0,0,.6); color: #fff; font-weight: 700; font-size: 11px; padding: 2px 7px; border-radius: 5px; }
  .recbadge i { width: 8px; height: 8px; border-radius: 50%; background: #ff4d3d; animation: pulse 1s infinite; }
  .is-rec .recbadge { display: inline-flex; }
  .bat { display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; background: var(--ok); transition: width .5s; }
  .bar.mid i { background: var(--warn); } .bar.low i { background: var(--rec); }
  .bat b { font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  .warn { color: var(--rec); font-size: 12px; font-weight: 600; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .detail { display: grid; gap: 16px; grid-template-columns: minmax(280px, 380px) 1fr; align-items: start; }
  @media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
  .panel + .panel { margin-top: 16px; }
  .kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .ctl { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; }
  .btns { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 140px; }
  .pad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
  .pad button { padding: 0; min-height: 44px; font-size: 18px; } .pad .home { font-size: 13px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  input[type=text] { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; }
  ol.list { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
  ol.list li { padding: 4px 0; border-bottom: 1px dashed var(--line); } ol.list li time { color: var(--muted); margin-right: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  footer { color: var(--muted); font-size: 12px; padding: 14px 4px; }
  @media (max-width: 480px) { .wrap { padding: 12px; } .timer { font-size: 18px; } }
  pre.adv { white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.35; background: var(--panel-2); border-radius: 10px; padding: 8px; margin: 8px 0 0; max-height: 55vh; overflow: auto; }
  .tabs { display: inline-flex; gap: 4px; background: var(--panel-2); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; min-height: 34px; padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 600; margin: 0; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  #logPanel { margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><a href="#/" style="color:inherit;text-decoration:none">GDC Multicam</a></h1>
      <div class="sub">Dashboard riprese · <span id="modeTxt">modalità simulazione</span></div>
    </div>
    <div class="row">
      <span class="pill" id="globalPill"><span class="dot"></span><span id="globalTxt">NESSUNA CAMERA</span></span>
      <span class="timer" id="globalTimer">00:00</span>
      <button class="primary" id="recAll" title="Scorciatoia: tasto R">● REC tutte</button>
      <button id="stopAll" disabled>■ STOP tutte</button>
    </div>
  </header>
  <div id="modeHost"></div>
  <main id="view"></main>
  <footer class="adv-only">Con le camere collegate (Supabase) stato, REC, impostazioni e anteprima sono reali. Batteria e movimenti pan/tilt non sono ancora disponibili. Senza abbinamento la dashboard mostra una simulazione.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="rt.js"></script>
<script src="dev.js"></script>
<script src="xfer.js"></script>
<script>
"use strict";
/* ===== Utilità ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const stamp = () => new Date().toLocaleTimeString("it-IT");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage non disponibile */ } },
};

/* ===== Registro attività avanzato ===== */
const PAGE_VERSION = "dashboard r15";
const ADVMAX = 6000, adv = []; let advOpen = false, advTimer = 0;
const sj = (x) => { try { return typeof x === "string" ? x : JSON.stringify(x); } catch { return String(x); } };
const rid = () => Math.random().toString(36).slice(2, 7);
function scheduleAdv() { if (advOpen && !advTimer) advTimer = setTimeout(() => { advTimer = 0; renderAdv(); }, 400); }
function dbg(level, src, msg, extra) { const x = { t: Date.now(), l: level, s: src, m: String(msg) + (extra !== undefined ? " " + sj(extra) : "") }; adv.push(x); if (adv.length > ADVMAX) adv.shift(); if (window.GDC_DEV) GDC_DEV.push(x.t, x.l, `${x.s}: ${x.m}`); scheduleAdv(); }
const fmtAdv = (x) => `${new Date(x.t).toISOString().slice(11, 23)} [${x.l}] ${x.s}: ${x.m}`;
const advSorted = () => adv.map((x, i) => [x, i]).sort((a, b) => a[0].t - b[0].t || a[1] - b[1]).map((x) => x[0]);
function advHeader() {
  const cams = cameras.map((c) => ({ id: c.id, nome: camTitle(c), fp: c.fp, stato: state[c.id] }));
  return [`REGISTRO ATTIVITÀ AVANZATO · ${PAGE_VERSION} · ${new Date().toISOString()}`,
    `modalità: ${REAL ? (MOCK_RT ? "simulazione locale (mock)" : "Supabase") : "simulazione"} · canale …${pairing ? String(pairing.c).slice(-4) : "-"} · collegamento: ${connStatus}`,
    `ambiente: ${navigator.userAgent} · schermo ${screen.width}x${screen.height}@${devicePixelRatio} · finestra ${innerWidth}x${innerHeight} · fuso ${Intl.DateTimeFormat().resolvedOptions().timeZone}`,
    `presenti nel canale: ${sj(transport.rt ? transport.rt.peers : [])}`, `anteprime attive: ${sj(Preview.active)}`, `camere (stato attuale): ${sj(cams)}`].join("\n");
}
const advText = () => advHeader() + "\n\n" + advSorted().map(fmtAdv).join("\n");
function renderAdv() { const pre = $("#advPre"); if (!pre) return; pre.textContent = advSorted().slice(-400).map(fmtAdv).join("\n"); pre.scrollTop = pre.scrollHeight; }
async function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.dataset.o || btn.textContent; btn.dataset.o = o; btn.textContent = "Copiato ✓"; setTimeout(() => (btn.textContent = o), 1500); } };
  try { await navigator.clipboard.writeText(text); done(); return; } catch { /* provo il metodo alternativo */ }
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok) { done(); return; } } catch { /* ok */ }
  prompt("Copia questo testo", text.slice(0, 20000));
}
addEventListener("error", (e) => dbg("error", "pagina", `${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`));
addEventListener("unhandledrejection", (e) => dbg("error", "pagina", `promessa rifiutata: ${e.reason?.name || ""} ${e.reason?.message || e.reason}`));
document.addEventListener("visibilitychange", () => dbg("info", "pagina", `visibilità: ${document.visibilityState}`));
addEventListener("online", () => dbg("info", "pagina", "rete: online")); addEventListener("offline", () => dbg("warn", "pagina", "rete: offline"));
addEventListener("pageshow", (e) => dbg("info", "pagina", `pageshow persisted=${e.persisted}`)); addEventListener("pagehide", (e) => dbg("info", "pagina", `pagehide persisted=${e.persisted}`));

/* ===== Pannello registri unico (tab: Registro / Attività avanzata) ===== */
let logTab = store.get("gdc.logTab", "basic"), logId = "";
const logPanel = (id) => { logId = id || ""; return `<section class="panel adv-only" id="logPanel">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <div class="tabs" role="tablist" aria-label="Registri"><button role="tab" data-tab="basic">Registro</button><button role="tab" data-tab="adv">Attività avanzata</button></div>
    <div class="row"><button class="ghost" data-logcopy>Copia</button><button class="ghost" data-logclear>Svuota</button></div>
  </div>
  <ol class="list" data-log="${esc(logId)}"></ol>
  <pre class="adv" id="advPre" hidden></pre>
</section>`; };
function applyLogTab() {
  const pn = $("#logPanel"); if (!pn) { advOpen = false; return; }
  advOpen = logTab === "adv";
  $$("[data-tab]", pn).forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === logTab)));
  $("ol.list", pn).hidden = advOpen; $("#advPre").hidden = !advOpen;
  if (advOpen) renderAdv(); else renderLogs();
}
document.addEventListener("click", (e) => {
  const tb = e.target.closest("[data-tab]"); if (tb) { logTab = tb.dataset.tab; store.set("gdc.logTab", logTab); dbg("info", "ui", `registro: scheda ${logTab === "adv" ? "attività avanzata" : "base"}`); applyLogTab(); return; }
  const cp = e.target.closest("[data-logcopy]"); if (cp) { copyText(logTab === "adv" ? advText() : logsText(logId), cp); return; }
  const cl = e.target.closest("[data-logclear]"); if (cl) { if (logTab === "adv") { adv.length = 0; dbg("info", "registro", "registro avanzato svuotato"); } else { logs.length = 0; } applyLogTab(); }
});

/* ===== Camere (nome dispositivo + nome camera, rinominabili) ===== */
const PAN_LIMIT = 90, TILT_LIMIT = 45, STEP = 5, MB_PER_MIN = 100; // stima 1080p30
const pairing = (window.GDC_RT && (GDC_RT.Pair.fromHash() || GDC_RT.Pair.load())) || null;
const REAL = !!pairing, MOCK_RT = new URLSearchParams(location.search).has("mock");
if (window.GDC_DEV) GDC_DEV.init({ role: "dashboard", dev: () => "dashboard", ver: PAGE_VERSION, pairing, log: (l, m) => dbg(l, "ui", m), backlog: () => advSorted().filter((x) => !/^cam /.test(x.s)).slice(-300).map((x) => ({ t: x.t, l: x.l, m: `${x.s}: ${x.m}` })), host: $("#modeHost") });
const CAM_KEY = REAL ? "gdc.cams.real" : "gdc.cameras";
let cameras = store.get(CAM_KEY, null) || (REAL ? [] : [
  { id: "cam1", device: "iPhone XR", name: "cam1", os: "iOS 16.3.1", totalGb: 128, freeGb: 30.6 },
]);
const saveCams = () => store.set(CAM_KEY, cameras);
let connStatus = REAL ? "connessione…" : "—", curDetail = null;
function setConn(s) {
  connStatus = s; const el = $("#connTxt"); if (el) el.textContent = s;
  const m = $("#modeTxt"); if (m) m.textContent = REAL ? (/^connesso/.test(s) ? "collegata · " + s : "collegamento · " + s) : "modalità simulazione";
}
const camById = (id) => cameras.find((c) => c.id === id);
const camTitle = (c) => `${c.device} · ${c.name}`;

/* ===== Trasporto =====
   Interfaccia: transport.send(camId, {cmd,...}) e transport.onState(cb(camId, stato)).
   Comandi: connect | disconnect | rec_start | rec_stop | move {pan,tilt} | home | charge {on}
   Il MockTransport simula le camere; sarà sostituito da una connessione reale (WebSocket). */
class MockTransport {
  constructor() { this.cb = () => {}; this.s = {}; }
  onState(cb) { this.cb = cb; }
  add(cam, connectAfter) {
    this.s[cam.id] = { online: false, rec: false, recStart: 0, battery: 78, charging: false, freeGb: cam.freeGb, totalGb: cam.totalGb,
      pan: 0, tilt: 0, rssi: -58, latency: 24, res: "1080p · 30 fps", orient: "Verticale 9:16", clips: [], n: 0 };
    if (connectAfter != null) setTimeout(() => this.send(cam.id, { cmd: "connect" }), connectAfter);
    this.push(cam.id);
  }
  remove(id) { delete this.s[id]; }
  start() { setInterval(() => this.tick(), 1000); }
  push(id) { if (this.s[id]) this.cb(id, this.s[id]); }
  tick() {
    for (const id in this.s) {
      const st = this.s[id]; if (!st.online) continue;
      if (st.rec) st.freeGb = Math.max(0, +(st.freeGb - 0.01).toFixed(3));
      st.battery = Math.min(100, Math.max(1, st.battery + (st.charging ? 0.15 : st.rec ? -0.12 : -0.04)));
      st.rssi = Math.max(-85, Math.min(-40, st.rssi + (Math.random() - 0.5) * 3));
      st.latency = Math.max(8, Math.round(st.latency + (Math.random() - 0.5) * 6));
      this.push(id);
    }
  }
  send(id, m) {
    const st = this.s[id], cam = camById(id); if (!st) return;
    const clamp = (v, l) => Math.max(-l, Math.min(l, v));
    switch (m.cmd) {
      case "connect": st.online = true; break;
      case "disconnect": if (st.rec) this.stopRec(st, cam); st.online = false; break;
      case "rec_start": if (st.online && !st.rec) { st.rec = true; st.recStart = Date.now(); } break;
      case "rec_stop": if (st.rec) this.stopRec(st, cam); break;
      case "move": if (st.online) { st.pan = clamp(st.pan + (m.pan || 0), PAN_LIMIT); st.tilt = clamp(st.tilt + (m.tilt || 0), TILT_LIMIT); } break;
      case "home": st.pan = 0; st.tilt = 0; break;
      case "charge": st.charging = !!m.on; break;
    }
    this.push(id);
  }
  stopRec(st, cam) {
    const ms = Date.now() - st.recStart; st.rec = false; st.n++;
    st.clips.unshift({ file: `${cam.name.toUpperCase().replace(/\s+/g, "_")}_${String(st.n).padStart(3, "0")}`, dur: ms, mb: Math.round(ms / 60000 * MB_PER_MIN) });
  }
}
let suggestMerge = null;
class RealtimeTransport {
  constructor(p) { this.p = p; this.cb = () => {}; this.s = {}; this.seen = {}; this.rt = null; this.id = store.get("gdc.dashId", null) || (() => { const v = "dash-" + Math.random().toString(36).slice(2, 8); store.set("gdc.dashId", v); return v; })(); }
  onState(cb) { this.cb = cb; }
  blank() { return { online: false, rec: false, recStart: 0, battery: null, charging: null, bufMB: null, maxBufMB: null, bps: 0, pan: 0, tilt: 0, rssi: null, latency: null, res: "—", orient: "—", clips: [], real: true, camReady: false, standby: false, err: "", storage: "", tl: null, tlStage: "" }; }
  add(cam) { this.s[cam.id] = this.blank(); this.push(cam.id); }
  remove(id) { delete this.s[id]; delete this.seen[id]; }
  push(id) { if (this.s[id]) this.cb(id, this.s[id]); }
  start() {
    this.rt = GDC_RT.connect({ pairing: this.p, role: "dashboard", id: this.id, meta: { name: "dashboard" }, mock: MOCK_RT, log: (l, m) => dbg(l, "rt", m) });
    this.rt.onStatus((s) => { setConn(s); if (/^connesso/.test(s)) this.rt.send("hello", { from: this.id }); });

              <div class="warn" data-bind="batWarn" data-cam="${c.id}"></div></div>
            <div class="kv"><small>Memoria camera</small><span data-bind="free" data-cam="${c.id}"></span></div>
            <div class="kv"><small>Registrazione</small><span data-bind="timer" data-cam="${c.id}"></span></div>
          </div>
        </div>
        <div class="card-f">
          <button class="primary" data-bind="recBtn" data-cam="${c.id}" data-act="rec_start">● REC</button>
          <button data-bind="stopBtn" data-cam="${c.id}" data-act="rec_stop">■ STOP</button>
          <button class="ghost" data-go="${c.id}">Dettagli</button>
        </div>
      </article>`).join("")}
      ${REAL ? `<div class="muted" style="padding:14px">${cameras.length ? "" : "Nessuna camera collegata. Sul telefono apri il link di abbinamento (pagina camera) e tocca “Avvia camera”."}</div>` : `<button class="add" id="addCam">+ Aggiungi camera (simulata)</button>`}
    </section>
    <section class="panel adv-only" style="margin-top:16px"><h2>Collegamento</h2>${connPanel()}</section>
    ${logPanel("")}`;
  curDetail = null; setConn(connStatus); renderPreflight();
  $("#view").onclick = async (e) => {
    if (e.target.id === "homePrev") { store.set("gdc.homePrev", e.target.checked); dbg("info", "ui", `anteprime nella home: ${e.target.checked ? "attive" : "spente"}`); Preview.stopAll(); Preview.ensureAll(); return; }
    if (e.target.closest("#mergeYes")) { mergeCams(); return; }
    if (e.target.closest("#mergeNo")) { dbg("info", "camere", "unione rifiutata dall'utente"); suggestMerge = null; showHome(); return; }
    if (e.target.closest("#cpCam") || e.target.closest("#cpDash")) { const link = GDC_RT.Pair.link(e.target.closest("#cpCam") ? "camera.html" : "dashboard.html", pairing); try { await navigator.clipboard.writeText(link); e.target.textContent = "Copiato ✓"; } catch { prompt("Copia questo link", link); } return; }
    if (e.target.closest("#newCh")) { if (confirm("Creo un nuovo canale: i link già inviati ai telefoni smetteranno di funzionare. Continuare?")) { GDC_RT.Pair.save({ ...pairing, c: GDC_RT.Pair.newChannel() }); location.reload(); } return; }
    if (e.target.closest("#unpair")) { if (confirm("Scollego questa dashboard dal canale?")) { GDC_RT.Pair.clear(); location.reload(); } return; }
    if (e.target.closest("#pairBtn")) { const p = GDC_RT.Pair.decode($("#pairTxt").value); if (!p) { alert("Codice non valido"); return; } GDC_RT.Pair.save(p); location.reload(); return; }
    const act = e.target.closest("[data-act]");
    if (act) { command(act.dataset.cam, { cmd: act.dataset.act }); return; }
    const go = e.target.closest("[data-go]");
    if (go) location.hash = "#/cam/" + go.dataset.go;
    if (e.target.closest("#addCam")) addCamera();
  };
  applyLogTab(); refresh(); Preview.ensureAll();
}

function showDetail(id) {
  Preview.stopAll();
  const c = camById(id);
  $("#view").innerHTML = `
    <a class="back" href="#/">‹ Tutte le camere</a>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h1 style="font-size:20px" data-bind="title" data-cam="${id}"></h1><span class="pill" data-bind="pill" data-cam="${id}"></span>
    </div>
    <div class="detail">
      <div>
        <div class="panel" data-bind="card" data-cam="${id}">
          ${previewHtml(id, "big")}
          <div class="ctl">
            <div class="btns">
              <button class="primary" data-bind="recBtn" data-cam="${id}" data-act="rec_start">● REC</button>
              <button data-bind="stopBtn" data-cam="${id}" data-act="rec_stop">■ STOP</button>
              ${REAL ? `<button class="ghost" data-bind="standbyBtn" data-cam="${id}" data-act="standby">Schermo nero</button>` : `<button class="ghost" data-cam="${id}" data-act="webcam">Usa webcam di questo PC (test)</button>`}
            </div>
            <div class="adv-only">
              <div class="pad" role="group" aria-label="Movimento (segnaposto)">
                <span></span><button data-m="0,${STEP}" aria-label="Su">▲</button><span></span>
                <button data-m="-${STEP},0" aria-label="Sinistra">◀</button><button class="home" data-act="home">⌂</button><button data-m="${STEP},0" aria-label="Destra">▶</button>
                <span></span><button data-m="0,-${STEP}" aria-label="Giù">▼</button><span></span>
              </div>
              <div class="muted" style="text-align:center;margin-top:4px">movimenti: segnaposto</div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="panel"><h2>Stato</h2>
          <div class="kvs">
            <div class="kv"><small>Registrazione in corso</small><span data-bind="timer" data-cam="${id}"></span></div>
            <div class="kv"><small>Connessione</small><span data-bind="conn" data-cam="${id}"></span></div>
            <div class="kv adv-only"><small>Pan / Tilt</small><span data-bind="pos" data-cam="${id}"></span></div>
            <div class="kv"><small>Schermo del telefono</small><span data-bind="screen" data-cam="${id}"></span></div>
          </div></div>
        <div class="panel"><h2>Batteria</h2>
          <div class="bat"><div class="bar" data-bind="batBar" data-cam="${id}"><i></i></div><b data-bind="batTxt" data-cam="${id}"></b></div>
          <div class="row" style="margin-top:8px;justify-content:space-between"><span class="muted" data-bind="batState" data-cam="${id}"></span><span class="warn" data-bind="batWarn" data-cam="${id}"></span>
            <button class="ghost" data-bind="chargeBtn" data-cam="${id}" data-act="charge"></button></div></div>
        <div class="panel"><h2>Spazio</h2>
          <div class="kv"><span data-bind="freeLong" data-cam="${id}"></span></div>
          <div class="muted" data-bind="freeEst" data-cam="${id}" style="font-weight:600;margin-top:4px"></div>
          ${REAL ? `<div data-bind="autoFreeUi" data-cam="${id}"><label class="f" style="display:flex;gap:8px;align-items:flex-start;margin:12px 0 4px"><input type="checkbox" id="autoFree" style="width:auto;min-height:0;margin-top:3px"><span>Se lo spazio sta finendo, elimina le clip più vecchie già trasferite e verificate</span></label>
            <div class="muted">Predefinito: spenta. In quel caso la camera si ferma in modo sicuro e avvisa. Le clip non ancora trasferite non vengono mai eliminate.</div></div>
          <div class="muted adv-only" data-bind="spaceNote" data-cam="${id}" style="margin-top:6px"></div>` : ""}</div>
        <div class="panel"><h2>Ripresa</h2>
          <div class="kvs">
            <div class="kv"><small>Qualità</small><span data-bind="res" data-cam="${id}"></span></div>
            <div class="kv"><small>Orientamento</small><span data-bind="orient" data-cam="${id}"></span></div>
          </div>${REAL ? `<div class="row" style="margin-top:8px"><select id="cfgRes"><option>720p</option><option selected>1080p</option><option>4K</option></select><select id="cfgBps"><option value="8000000">8 Mbps</option><option value="20000000" selected>20 Mbps</option><option value="40000000">40 Mbps</option></select><button class="ghost" id="cfgApply">Applica al telefono</button></div><div class="muted" style="margin-top:6px">Il bitrate è un tetto: con scene ferme il file può pesare meno.</div>` : `<div class="muted" style="margin-top:6px">Modalità simulazione: impostazioni non modificabili.</div>`}</div>
        ${REAL ? `<div class="panel" data-bind="xferUi" data-cam="${id}"></div>` : ""}
        ${REAL ? `<div class="panel" data-bind="zoomUi" data-cam="${id}"><h2>Zoom</h2>
          <div class="row" style="gap:10px;align-items:center"><input type="range" id="zSlider" min="1" max="3" step="0.1" value="1" style="flex:1" disabled><b id="zVal" style="min-width:52px;text-align:right">—</b></div>
          <div class="row" style="margin-top:8px">${[0.5, 1, 2, 3, 5].map((z) => `<button class="ghost zb" data-z="${z}" disabled>${z}×</button>`).join("")}</div>
          <div class="muted" id="zNote" style="margin-top:6px"></div></div>` : ""}
        ${REAL ? `<div class="panel"><h2>Time-lapse</h2>
          <div class="row" style="gap:8px;align-items:flex-end">
            <label class="f" style="flex:1;min-width:150px">Modalità<select id="tlMode"><option value="auto">Automatica (come iPhone)</option><option value="man">Manuale</option></select></label>
            <label class="f" id="tlIntW" style="flex:1;min-width:150px" hidden>Immagini<select id="tlInt"><option value="0.5">2 al secondo</option><option value="1">1 al secondo</option><option value="2">1 ogni 2 s</option><option value="5" selected>1 ogni 5 s</option><option value="10">1 ogni 10 s</option><option value="30">1 ogni 30 s</option><option value="60">1 ogni 60 s</option></select></label>
            <label class="f" style="flex:1;min-width:110px">Video a<select id="tlFps"><option value="24">24 fps</option><option value="30" selected>30 fps</option></select></label>
            <label class="f" style="flex:1;min-width:110px">Qualità JPEG<select id="tlQ"><option value="0.8">Normale</option><option value="0.92" selected>Alta</option></select></label>
          </div>
          <div class="row"><button class="primary" data-bind="tlStartBtn" data-cam="${id}" data-act="tl_start">● Avvia time-lapse</button><button data-bind="tlStopBtn" data-cam="${id}" data-act="tl_stop">■ Ferma e crea il video</button></div>
          <div class="muted" id="tlHelp" style="margin-top:6px"></div>
          <div style="margin-top:8px" data-bind="tlStat" data-cam="${id}"></div>
          <div class="muted" style="margin-top:6px">Usa la qualità della camera impostata in “Ripresa”. Il video si crea sul telefono quando fermi il time-lapse (ci mette circa quanto dura il video).</div></div>` : ""}
        <div class="panel"><h2>Impostazioni camera</h2>
          <label class="f">Dispositivo<input type="text" id="fDev" value="${esc(c.device)}" maxlength="40"></label>
          <label class="f">Nome camera<input type="text" id="fName" value="${esc(c.name)}" maxlength="30"></label>
          <div class="muted adv-only">Sistema: ${esc(c.os)}</div>
          <div class="row" style="margin-top:10px">
            <button class="ghost" data-bind="connBtn" data-cam="${id}" data-act="toggleConn"></button>
            ${REAL ? `<button class="ghost" id="cpThis">Copia link di questa camera</button>` : ""}<button class="ghost" id="rmCam">Rimuovi camera</button>
          </div></div>
        <div class="panel"><h2>Clip della sessione</h2><ol class="list" data-bind="clips" data-cam="${id}"></ol></div>
        ${logPanel(id)}
      </div>
    </div>`;
  const v = $("#view");
  v.onclick = async (e) => {
    const m = e.target.closest("[data-m]");
    if (m) { const [pan, tilt] = m.dataset.m.split(",").map(Number); command(id, { cmd: "move", pan, tilt }); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const act = a.dataset.act;
    if (act === "toggleConn") command(id, { cmd: state[id].online ? "disconnect" : "connect" });
    else if (act === "charge") command(id, { cmd: "charge", on: !state[id].charging });
    else if (act === "webcam") toggleWebcam(id, a);
    else if (act === "standby") command(id, { cmd: "standby", on: !state[id].standby });
    else if (act === "tl_start") command(id, { cmd: "tl_start", mode: $("#tlMode").value, int: Number($("#tlInt").value), fps: Number($("#tlFps").value), q: Number($("#tlQ").value) });
    else if (act === "tl_stop") command(id, { cmd: "tl_stop" });
    else command(id, { cmd: act });
  };
  const rename = () => {
    c.device = $("#fDev").value.trim() || c.device; c.name = $("#fName").value.trim() || c.name;
    saveCams(); refresh(); if (REAL) transport.send(id, { cmd: "rename", name: c.name, device: c.device });
  };
  if (REAL) { const tlSync = () => { const auto = $("#tlMode").value === "auto"; $("#tlIntW").hidden = auto; $("#tlHelp").textContent = auto ? "Come l'iPhone: 2 immagini al secondo, poi l'intervallo raddoppia a 10, 20, 40 minuti scartando un'immagine su due. Il video dura circa 20-40 s a 30 fps." : "Intervallo fisso scelto da te."; }; $("#tlMode").onchange = tlSync; tlSync(); }
  if (REAL) $("#cpThis").onclick = (e) => copyText(GDC_RT.Pair.link("camera.html", pairing, id), e.currentTarget);
  if (REAL) { const af = $("#autoFree"); if (af) af.onchange = () => command(id, { cmd: "space_cfg", autoFree: af.checked }); }
  if (REAL) { let zT = 0; const zs = $("#zSlider"); const sendZ = () => command(id, { cmd: "zoom", z: Number(zs.value) });
    zs.oninput = () => { zDrag = true; $("#zVal").textContent = Number(zs.value).toFixed(1) + "×"; if (!zT) zT = setTimeout(() => { zT = 0; sendZ(); }, 100); };
    zs.onchange = () => { zDrag = false; sendZ(); };
    $$(".zb").forEach((b) => { b.onclick = () => command(id, { cmd: "zoom", z: Number(b.dataset.z) }); }); }
  if (REAL) $("#cfgApply").onclick = () => command(id, { cmd: "config", res: $("#cfgRes").value, bps: Number($("#cfgBps").value) });
  curDetail = id;
  $("#fDev").onchange = rename; $("#fName").onchange = rename;
  $("#rmCam").onclick = () => {
    if (!confirm(`Rimuovere ${camTitle(c)} dalla dashboard?`)) return;
    transport.remove(id); delete state[id]; cameras = cameras.filter((x) => x.id !== id); saveCams(); location.hash = "#/";
  };
  applyLogTab(); refresh(); Preview.ensureAll();
}

async function toggleWebcam(id, btn) {
  const vid = $(`[data-vid="${id}"]`), can = $(`[data-prev="${id}"]`), tag = $(`[data-tag="${id}"]`);
  if (vid.srcObject) {
    vid.srcObject.getTracks().forEach((t) => t.stop()); vid.srcObject = null; vid.hidden = true; can.hidden = false;
    tag.textContent = "SIMULATA"; btn.textContent = "Usa webcam di questo PC (test)"; return;
  }
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    await vid.play(); vid.hidden = false; can.hidden = true; tag.textContent = "WEBCAM PC (TEST)"; btn.textContent = "Torna all'anteprima simulata";
  } catch (e) { log(id, "Webcam non disponibile (" + (e.name || "errore") + ")"); }
}

function addCamera() {
  const n = cameras.length + 1; let id = "cam" + n; while (camById(id)) id += "x";
  const cam = { id, device: "Nuovo telefono", name: "cam" + n, os: "—", totalGb: 64, freeGb: 20 };
  cameras.push(cam); saveCams(); transport.add(cam, 500); log(id, `${camTitle(cam)}: aggiunta (simulazione)`); showHome();
}

/* ===== Router ===== */
function route() {
  curDetail = null;
  dbg("info", "ui", `vista: ${location.hash || "#/"}`);
  const m = location.hash.match(/^#\/cam\/(.+)$/);
  if (m && camById(m[1])) showDetail(m[1]); else showHome();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* ===== REC globale + scorciatoia ===== */
$("#recAll").onclick = () => cameras.forEach((c) => state[c.id]?.online && !state[c.id].rec && command(c.id, { cmd: "rec_start" }));
$("#stopAll").onclick = () => cameras.forEach((c) => state[c.id]?.rec && command(c.id, { cmd: "rec_stop" }));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.toLowerCase() === "r") { const b = $("#recAll").disabled ? $("#stopAll") : $("#recAll"); if (!b.disabled) b.click(); }
});
setInterval(() => {
  const recs = cameras.map((c) => state[c.id]).filter((s) => s && s.rec);
  $("#globalTimer").textContent = recs.length ? fmtTime(Date.now() - Math.min(...recs.map((s) => s.recStart))) : "00:00";
  $$('[data-bind="timer"],[data-bind="badge"]').forEach((el) => BIND[el.dataset.bind](state[el.dataset.cam] || {}, null, el));
}, 250);

/* ===== Anteprima simulata (reagisce a pan/tilt) ===== */
function drawPreview(t) {
  $$("canvas[data-prev]").forEach((cv) => {
    if (cv.hidden) return;
    const id = cv.dataset.prev, st = state[id] || { pan: 0, tilt: 0 }, g = cv.getContext("2d"), W = cv.width, H = cv.height;
    if (REAL) { g.fillStyle = "#14161a"; g.fillRect(0, 0, W, H); g.fillStyle = "rgba(255,255,255,.55)"; g.font = "15px sans-serif"; g.textAlign = "center"; g.fillText("Nessuna anteprima", W / 2, H / 2); g.textAlign = "start"; return; }
    const ox = (st.pan / PAN_LIMIT) * -120, oy = (st.tilt / TILT_LIMIT) * 120, hue = 200 + (cameras.findIndex((c) => c.id === id) % 4) * 45;
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsl(${hue} 35% 22%)`); grad.addColorStop(1, `hsl(${hue + 30} 30% 10%)`);
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
    for (let x = -60; x < W + 60; x += 60) { g.beginPath(); g.moveTo(x + (ox % 60), 0); g.lineTo(x + (ox % 60), H); g.stroke(); }
    for (let y = -60; y < H + 60; y += 60) { g.beginPath(); g.moveTo(0, y + (oy % 60)); g.lineTo(W, y + (oy % 60)); g.stroke(); }
    g.fillStyle = `hsl(${hue + 120} 70% 62%)`; g.beginPath(); g.arc(W / 2 + ox + Math.sin(t / 900) * 40, H / 2 + oy + Math.cos(t / 1300) * 30, 34, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,255,255,.35)"; g.setLineDash([6, 6]); g.strokeRect(W * .1, H * .08, W * .8, H * .84); g.setLineDash([]);
    g.fillStyle = "rgba(255,255,255,.85)"; g.font = "600 15px sans-serif"; g.fillText("9:16", 14, H - 34);
    g.font = "13px monospace"; g.fillText(new Date().toLocaleTimeString("it-IT"), 14, H - 14);
  });
  requestAnimationFrame(drawPreview);
}

/* ===== Avvio ===== */
cameras.forEach((c, i) => transport.add(c, i === 0 ? 600 : null));
transport.start();
route();
requestAnimationFrame(drawPreview);
dbg("info", "avvio", `${PAGE_VERSION}`, { modalita: REAL ? (MOCK_RT ? "mock" : "supabase") : "simulazione", canale: pairing ? "…" + String(pairing.c).slice(-4) : null, camere: cameras.map((c) => `${c.id}=${camTitle(c)}`), dashId: transport.id || null, standalone: navigator.standalone === true, lingua: navigator.language, online: navigator.onLine });
setConn(connStatus); log("", REAL ? "Dashboard avviata (collegamento reale)" : "Dashboard avviata (simulazione)");
</script>
