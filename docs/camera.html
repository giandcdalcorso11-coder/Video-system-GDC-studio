<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera GDC</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --panel-2:#eef0f3; --text:#14161a; --muted:#5f6672; --line:#d9dde3; --ok:#12875a; --bad:#d92d20; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1114; --panel:#181b20; --panel-2:#20242b; --text:#eceef2; --muted:#98a0ad; --line:#2b3038; --ok:#3ccf91; --bad:#ff5a4d; --accent:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:12px max(12px, env(safe-area-inset-left)) 40px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 19px; margin: 4px 0 0; } h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-height: 44px; margin: 0 6px 6px 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.rec { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; width: 100%; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  video { width: 100%; max-height: 40vh; background: #000; border-radius: 10px; display: block; object-fit: contain; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); } .pill.ok { color: var(--ok); border-color: var(--ok); } .pill.ok .dot { background: var(--ok); } .pill.rec { color: var(--bad); border-color: var(--bad); } .pill.rec .dot { background: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } } @media (prefers-reduced-motion: reduce) { .pill.rec .dot { animation: none; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: 4px 0; border-bottom: 1px dashed var(--line); vertical-align: top; } td:first-child { color: var(--muted); width: 45%; padding-right: 8px; }
  .muted { color: var(--muted); font-size: 13px; } .err { color: var(--bad); font-weight: 600; }
  ol { list-style: none; margin: 0; padding: 0; } ol li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.35; background: var(--panel-2); border-radius: 10px; padding: 8px; margin: 8px 0 0; max-height: 50vh; overflow: auto; }
  #blackout { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 2147483647; display: none; } #blackout.on { display: block; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>Camera</h1><span class="pill" id="connPill"><span class="dot"></span><span id="connTxt">non collegata</span></span></div>

  <section class="panel" id="pairBox" hidden>
    <h2>Abbinamento</h2>
    <p class="muted" style="margin-top:0">Apri il link di abbinamento ricevuto, oppure incolla qui il codice che inizia con <b>gdc1.</b></p>
    <textarea id="pairTxt" rows="3" placeholder="gdc1.…"></textarea>
    <button class="primary" id="pairBtn" style="margin-top:8px">Abbina</button>
  </section>

  <section class="panel" id="main" hidden>
    <h2>Questo telefono</h2>
    <div class="row"><div style="flex:1;min-width:130px"><label>Dispositivo<input id="fDev" maxlength="40"></label></div><div style="flex:1;min-width:130px"><label>Nome camera<input id="fName" maxlength="30"></label></div></div>
    <div class="row"><div style="flex:1;min-width:130px"><label>Qualità<select id="fRes"><option value="720p">720p</option><option value="1080p">1080p</option><option value="4K">4K</option></select></label></div>
      <div style="flex:1;min-width:130px"><label>Bitrate video<select id="fBps"><option value="8000000">8 Mbps</option><option value="20000000">20 Mbps</option><option value="40000000">40 Mbps</option></select></label></div></div>
    <button class="primary" id="camBtn">Avvia camera</button><button id="camStop" disabled>Ferma camera</button><button id="blackBtn">Schermo nero</button><button id="myLink">Copia il mio link</button>
    <label style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="fAuto" style="width:auto;min-height:0"> Avvia la camera all'apertura della pagina</label>
    <video id="vid" muted playsinline></video>
  </section>

  <section class="panel" id="statPanel" hidden>
    <h2>Stato</h2>
    <table id="stat"></table>
    <button class="rec" id="recBtn" disabled style="margin-top:8px">● REC (prova locale)</button>
    <div id="msg" class="muted"></div>
  </section>

  <section class="panel" id="clipPanel" hidden>
    <h2>Registrazioni sul telefono</h2>
    <ol id="clips"></ol>
    <div class="muted" id="clipNote"></div>
  </section>

  <section class="panel" id="dbgPanel" hidden>
    <h2>Registro attività</h2>
    <button id="dbgToggle">Mostra</button><button id="dbgCopy">Copia tutto</button>
    <pre id="dbgPre" hidden></pre>
  </section>
</main>
<div id="blackout"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="rt.js"></script>
<script>
"use strict";
const PAGE_VERSION = "camera r5";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };
const getCookie = (k) => (document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)")) || [])[1] || null;
const setCookie = (k, v) => { try { document.cookie = `${k}=${v}; max-age=31536000; path=/; SameSite=Lax`; } catch { /* cookie bloccati */ } };

/* ===== Registro attività (locale + inviato alla dashboard) ===== */
const LOGMAX = 4000, dbgBuf = [], dbgOut = []; let dbgOpen = false, dbgTimer = 0, rt = null;
const sj = (x) => { try { return typeof x === "string" ? x : JSON.stringify(x); } catch { return String(x); } };
function dbg(level, msg, extra) {
  const line = { t: Date.now(), l: level, m: String(msg) + (extra !== undefined ? " " + sj(extra) : "") };
  dbgBuf.push(line); if (dbgBuf.length > LOGMAX) dbgBuf.shift(); dbgOut.push(line); if (dbgOut.length > 600) dbgOut.shift();
  if (dbgOpen && !dbgTimer) dbgTimer = setTimeout(() => { dbgTimer = 0; renderDbg(); }, 400);
}
const fmtLine = (x) => `${new Date(x.t).toISOString().slice(11, 23)} [${x.l}] ${x.m}`;
function renderDbg() { const pre = $("dbgPre"); pre.textContent = dbgBuf.slice(-300).map(fmtLine).join("\n"); pre.scrollTop = pre.scrollHeight; }
function flushDbg() { if (rt && rt.status && /^connesso/.test(rt.status) && dbgOut.length) { const lines = dbgOut.splice(0, 40); rt.send("dbg", { id: ID, lines }); } }
async function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.dataset.o || btn.textContent; btn.dataset.o = o; btn.textContent = "Copiato ✓"; setTimeout(() => (btn.textContent = o), 1500); } };
  try { await navigator.clipboard.writeText(text); done(); return; } catch { /* provo il metodo alternativo */ }
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok) { done(); return; } } catch { /* ok */ }
  prompt("Copia questo testo", text.slice(0, 20000));
}
addEventListener("error", (e) => { dbg("error", `errore pagina: ${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`); });
addEventListener("unhandledrejection", (e) => { dbg("error", `promessa rifiutata: ${e.reason?.name || ""} ${e.reason?.message || e.reason}`); });
document.addEventListener("visibilitychange", () => { dbg("info", `visibilità: ${document.visibilityState}`); if (document.visibilityState === "visible") { db.reset(); loadSessions(); publish(); setTimeout(() => autoOpen("ritorno in primo piano"), 800); } });
addEventListener("pagehide", (e) => dbg("info", `pagehide persisted=${e.persisted}`));
addEventListener("pageshow", (e) => { dbg("info", `pageshow persisted=${e.persisted}`); if (e.persisted) { db.reset(); loadSessions(); publish(); } });
addEventListener("online", () => dbg("info", "rete: online")); addEventListener("offline", () => dbg("warn", "rete: offline"));
document.addEventListener("freeze", () => dbg("warn", "pagina congelata dal browser")); document.addEventListener("resume", () => dbg("info", "pagina ripresa"));

/* ===== Identità della camera ===== */
const hashPair = (window.GDC_RT && GDC_RT.Pair.fromHash()) || null; // legge e consuma il link di abbinamento
const idSrc = (() => {
  const lk = hashPair && hashPair.linkId, ls = store.get("gdc.camId", null), ck = getCookie("gdc_camid");
  if (lk) return { id: lk, src: "link" }; if (ls) return { id: ls, src: "memoria locale" }; if (ck) return { id: ck, src: "cookie" };
  return { id: "cam-" + Math.random().toString(36).slice(2, 8), src: "nuova" };
})();
const ID = idSrc.id; store.set("gdc.camId", ID); setCookie("gdc_camid", ID);
const FP = (() => { const s = [navigator.userAgent, screen.width, screen.height, devicePixelRatio, navigator.hardwareConcurrency, Intl.DateTimeFormat().resolvedOptions().timeZone].join("|"); let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(16); })();
const cfg = Object.assign({ device: /iPhone/.test(navigator.userAgent) ? "iPhone" : "Telefono", name: "cam1", res: "1080p", bps: 20000000, facing: "environment", autoCam: true }, store.get("gdc.camCfg", {}));
const RES = { "720p": [1280, 720], "1080p": [1920, 1080], "4K": [3840, 2160] };
const MAX_BUF = 700 * 1048576; // limite di sicurezza misurato nei test (circa 0,78 GB)
const MOCK = new URLSearchParams(location.search).has("mock");
const OS = (() => { const m = navigator.userAgent.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))?/); return m ? `iOS ${m[1]}.${m[2]}${m[3] ? "." + m[3] : ""}` : navigator.platform; })();
let stream = null, recording = null, standby = false, lastErr = "", pairing = null, lastTapT = 0, storageMode = "indexeddb";
const bat = { level: null, charging: null };

/* ===== Archivio locale: pezzi della registrazione e registrazioni (IndexedDB, con riapertura automatica) ===== */
const db = (() => {
  let h = null; const mem = { chunks: new Map(), sessions: new Map(), frames: new Map() };
  const open = () => h ? Promise.resolve(h) : new Promise((res, rej) => {
    const r = indexedDB.open("gdc-camera", 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("chunks")) d.createObjectStore("chunks"); if (!d.objectStoreNames.contains("sessions")) d.createObjectStore("sessions", { keyPath: "id" }); if (!d.objectStoreNames.contains("frames")) d.createObjectStore("frames"); };
    r.onsuccess = () => { h = r.result; h.onclose = () => { dbg("warn", "IndexedDB: connessione chiusa dal browser"); h = null; }; h.onversionchange = () => { dbg("warn", "IndexedDB: versionchange"); try { h.close(); } catch { /* ok */ } h = null; }; res(h); };
    r.onerror = () => rej(r.error); r.onblocked = () => dbg("warn", "IndexedDB: apertura bloccata");
  });
  const run = async (fn) => {
    let last;
    for (let i = 0; i < 3; i++) {
      try { return await fn(await open()); }
      catch (e) { last = e; if (i < 2 && ["InvalidStateError", "TransactionInactiveError", "UnknownError", "AbortError"].includes(e.name)) { dbg("warn", `IndexedDB ${e.name} (${e.message}): riapro e riprovo ${i + 1}/2`); try { h && h.close(); } catch { /* ok */ } h = null; await sleep(200 * (i + 1)); continue; } throw e; }
    }
    throw last;
  };
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = (t) => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("transazione annullata")); });
  const range = (sid) => IDBKeyRange.bound(sid + ":", sid + ":￿");
  return {
    reset() { try { h && h.close(); } catch { /* ok */ } h = null; },
    async selfTest() {
      const t0 = performance.now();
      try { await run(async (d) => { const t = d.transaction("chunks", "readwrite"); t.objectStore("chunks").put(new Blob(["x"]), "_test"); await done(t); const t2 = d.transaction("chunks", "readwrite"); t2.objectStore("chunks").delete("_test"); await done(t2); }); dbg("info", `archivio IndexedDB ok (${Math.round(performance.now() - t0)} ms)`); storageMode = "indexeddb"; return true; }
      catch (e) { dbg("error", `archivio IndexedDB NON utilizzabile: ${e.name}: ${e.message}`); storageMode = "memoria"; return false; }
    },
    putFrame: (k, b) => storageMode === "memoria" ? Promise.resolve(void mem.frames.set(k, b)) : run(async (d) => { const t = d.transaction("frames", "readwrite"); t.objectStore("frames").put(b, k); await done(t); }),
    frameKeys: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.frames.keys()].filter((k) => k.startsWith(sid + ":")).sort()) : run((d) => rq(d.transaction("frames").objectStore("frames").getAllKeys(range(sid)))),
    getFrame: (k) => storageMode === "memoria" ? Promise.resolve(mem.frames.get(k)) : run((d) => rq(d.transaction("frames").objectStore("frames").get(k))),
    delFrameKeys: (keys) => storageMode === "memoria" ? Promise.resolve(keys.forEach((k) => mem.frames.delete(k))) : run(async (d) => { const t = d.transaction("frames", "readwrite"), st = t.objectStore("frames"); keys.forEach((k) => st.delete(k)); await done(t); }),
    delFrames: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.frames.keys()].filter((k) => k.startsWith(sid + ":")).forEach((k) => mem.frames.delete(k))) : run(async (d) => { const t = d.transaction("frames", "readwrite"); t.objectStore("frames").delete(range(sid)); await done(t); }),
    putChunk: (k, b) => storageMode === "memoria" ? Promise.resolve(void mem.chunks.set(k, b)) : run(async (d) => { const t = d.transaction("chunks", "readwrite"); t.objectStore("chunks").put(b, k); await done(t); }),
    putSession: (o) => storageMode === "memoria" ? Promise.resolve(void mem.sessions.set(o.id, o)) : run(async (d) => { const t = d.transaction("sessions", "readwrite"); t.objectStore("sessions").put(o); await done(t); }),
    sessions: () => storageMode === "memoria" ? Promise.resolve([...mem.sessions.values()]) : run((d) => rq(d.transaction("sessions").objectStore("sessions").getAll())),
    chunks: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.chunks.entries()].filter(([k]) => k.startsWith(sid + ":")).sort((a, b) => (a[0] < b[0] ? -1 : 1)).map((x) => x[1])) : run((d) => rq(d.transaction("chunks").objectStore("chunks").getAll(range(sid)))),
    delSession: (sid) => storageMode === "memoria" ? Promise.resolve((mem.sessions.delete(sid), [...mem.chunks.keys()].filter((k) => k.startsWith(sid + ":")).forEach((k) => mem.chunks.delete(k)))) : run(async (d) => { const t = d.transaction(["chunks", "sessions", "frames"], "readwrite"); t.objectStore("chunks").delete(range(sid)); t.objectStore("frames").delete(range(sid)); t.objectStore("sessions").delete(sid); await done(t); }),
  };
})();
let sessions = [];
const bufBytes = () => sessions.filter((s) => s.status !== "inviata").reduce((a, s) => a + (s.bytes || 0), 0) + (recording && !sessions.some((s) => s.id === recording.sid) ? recording.bytes : 0) + (tl ? tl.bytes : 0);
async function loadSessions() {
  try { sessions = (await db.sessions()).sort((a, b) => b.start - a.start); if (lastErr.startsWith("Archivio")) lastErr = ""; dbg("info", `registrazioni nell'archivio: ${sessions.length}`); }
  catch (e) { lastErr = "Archivio non disponibile: " + e.name; dbg("error", `lettura archivio fallita: ${e.name}: ${e.message}`); }
  renderClips();
}

/* ===== Fotocamera ===== */
async function openCam() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const [w, h] = RES[cfg.res] || RES["1080p"], base = { video: { facingMode: cfg.facing, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: 30 } } }, t0 = performance.now();
  dbg("info", `apro la camera: ${cfg.res} ${cfg.facing}`);
  try { stream = await navigator.mediaDevices.getUserMedia({ ...base, audio: true }); }
  catch (e) {
    dbg("warn", `camera+audio non disponibili: ${e.name}: ${e.message}`);
    try { stream = await navigator.mediaDevices.getUserMedia({ ...base, audio: false }); lastErr = "Microfono non disponibile: registro senza audio"; }
    catch (e2) { lastErr = "Camera non disponibile: " + e2.name; dbg("error", `camera non disponibile: ${e2.name}: ${e2.message}`); stream = null; publish(); throw e2; }
  }
  stream.getTracks().forEach((t) => { t.onended = () => { dbg("error", `traccia ${t.kind} terminata (camera interrotta?)`); if (t.kind === "video") { lastErr = "Camera interrotta dal sistema"; if (recording) stopRec(); if (tl && tl.stage === "shooting") tlStop(); stream = null; $("camStop").disabled = true; publish(); } }; t.onmute = () => dbg("warn", `traccia ${t.kind} silenziata dal sistema`); t.onunmute = () => dbg("info", `traccia ${t.kind} riattivata`); });
  const v = $("vid"); v.srcObject = stream; await v.play().catch((e) => dbg("warn", `play anteprima locale: ${e.name}`));
  const vt = stream.getVideoTracks()[0], at = stream.getAudioTracks()[0];
  dbg("info", `camera aperta in ${Math.round(performance.now() - t0)} ms`, { video: vt && vt.getSettings(), audio: at ? at.getSettings() : "assente", etichetta: vt && vt.label });
  lastErr = lastErr.startsWith("Camera") ? "" : lastErr; $("camStop").disabled = false; $("recBtn").disabled = false; publish();
}
let opening = false;
async function autoOpen(why) {
  if (!cfg.autoCam || stream || opening || recording || !pairing) return; opening = true; dbg("info", `avvio automatico della camera (${why})`);
  try { await openCam(); dbg("info", "avvio automatico riuscito"); }
  catch (e) { lastErr = e.name === "NotAllowedError" ? "Camera non avviata: tocca “Avvia camera” (serve il permesso o un tocco)" : lastErr; dbg("warn", `avvio automatico non riuscito: ${e.name}: ${e.message}`); publish(); }
  opening = false;
}
function stopCam() { dbg("info", "ferma camera"); if (recording) stopRec(); if (tl && tl.stage === "shooting") tlStop(); stream?.getTracks().forEach((t) => t.stop()); stream = null; $("vid").srcObject = null; $("camStop").disabled = true; $("recBtn").disabled = true; closePreviews(); publish(); }

/* ===== Registrazione: i pezzi vanno subito su disco ===== */
async function startRec() {
  if (recording) { dbg("warn", "rec_start ignorato: già in registrazione"); return; }
  if (tl) { lastErr = "Time-lapse in corso: fermalo prima di registrare"; dbg("warn", "rec_start rifiutato: time-lapse in corso"); publish(); return; }
  if (!stream) { dbg("info", "rec_start senza camera: provo ad aprirla"); try { await openCam(); } catch { return; } }
  const mime = ["video/mp4;codecs=avc1", "video/mp4"].find((t) => MediaRecorder.isTypeSupported(t));
  const sid = "s" + Date.now().toString(36), start = Date.now();
  let mr; try { mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: Number(cfg.bps) }); } catch (e) { lastErr = "Registrazione non avviabile: " + e.message; dbg("error", `MediaRecorder non creato: ${e.name}: ${e.message}`); publish(); return; }
  const rec = { mr, sid, start, seq: 0, bytes: 0, pending: 0, errs: 0, wr: [], mime: mr.mimeType || mime || "video/mp4", stopping: false };
  recording = rec; lastErr = ""; dbg("info", `REC avviato sessione ${sid}`, { mime: rec.mime, bps: Number(cfg.bps), res: cfg.res, archivio: storageMode });
  mr.onerror = (e) => dbg("error", `MediaRecorder errore: ${e.error?.name || ""} ${e.error?.message || e.message || ""}`);
  mr.onpause = () => dbg("warn", "MediaRecorder in pausa"); mr.onresume = () => dbg("info", "MediaRecorder ripreso");
  mr.ondataavailable = (e) => {
    if (!e.data.size) return; const k = `${sid}:${String(++rec.seq).padStart(6, "0")}`, t = performance.now(); rec.bytes += e.data.size; rec.pending++;
    db.putChunk(k, e.data).then(() => rec.wr.push(performance.now() - t)).catch((x) => { rec.errs++; lastErr = "Scrittura su disco fallita: " + (x?.name || "errore"); dbg("error", `scrittura pezzo ${k} fallita: ${x?.name}: ${x?.message}`); }).finally(() => rec.pending--);
    if (bufBytes() > MAX_BUF && !rec.stopping) { lastErr = "Buffer pieno: registrazione fermata"; dbg("error", "buffer pieno: fermo la registrazione"); stopRec(); }
  };
  rec.statTimer = setInterval(() => { const vt = stream && stream.getVideoTracks()[0]; dbg("info", `REC ${Math.round((Date.now() - start) / 1000)}s: ${rec.seq} pezzi, ${(rec.bytes / 1048576).toFixed(1)} MB, in scrittura ${rec.pending}, errori ${rec.errs}, buffer ${Math.round(bufBytes() / 1048576)} MB`, { videoTrack: vt ? { stato: vt.readyState, muto: vt.muted, ...vt.getSettings() } : "assente" }); }, 10000);
  mr.onstop = async () => {
    clearInterval(rec.statTimer); while (rec.pending > 0) await sleep(50);
    const s = { id: sid, start, end: Date.now(), dur: Date.now() - start, bytes: rec.bytes, chunks: rec.seq, mime: rec.mime, res: cfg.res, bps: Number(cfg.bps), status: rec.errs ? "errore" : "pronta" };
    try { await db.putSession(s); } catch (e) { lastErr = "Registro non salvato: " + e.name; dbg("error", `registro sessione non salvato: ${e.name}: ${e.message}`); }

/* ===== Comandi dalla dashboard ===== */

      case "config": if (!recording) { if (m.res && RES[m.res]) cfg.res = m.res; if (m.bps) cfg.bps = Number(m.bps); store.set("gdc.camCfg", cfg); syncForm(); if (stream) { try { await openCam(); } catch { ok = false; } } publish(); detail = { res: cfg.res, bps: cfg.bps }; } else { lastErr = "Impostazioni non applicate: registrazione in corso"; ok = false; detail = lastErr; publish(); } break;
      case "rename": if (m.name) cfg.name = m.name; if (m.device) cfg.device = m.device; store.set("gdc.camCfg", cfg); syncForm(); rt?.setMeta({ name: cfg.name, device: cfg.device }); publish(); detail = { name: cfg.name, device: cfg.device }; break;
      case "tl_start": ok = await tlStart(m); detail = ok ? "time-lapse avviato" : lastErr || "non avviato"; break;
      case "tl_stop": tlStop(); detail = "stop richiesto"; break;
      case "preview_start": await startPreview(m.from, m.q); detail = "offerta inviata"; break;
      case "preview_stop": try { clearInterval(pcs[m.from]?.statT); pcs[m.from]?.pc.close(); } catch { /* ok */ } delete pcs[m.from]; detail = "chiusa"; break;
      case "battery": bat.level = Number(m.level); bat.charging = m.charging == null ? bat.charging : !!m.charging; publish(); detail = bat; break;

}

/* ===== Interfaccia ===== */
function syncForm() { $("fAuto").checked = !!cfg.autoCam; $("fDev").value = cfg.device; $("fName").value = cfg.name; $("fRes").value = cfg.res; $("fBps").value = String(cfg.bps); }
$("fDev").onchange = $("fName").onchange = () => { cfg.device = $("fDev").value.trim() || cfg.device; cfg.name = $("fName").value.trim() || cfg.name; store.set("gdc.camCfg", cfg); rt?.setMeta({ name: cfg.name, device: cfg.device }); publish(); };
$("fRes").onchange = $("fBps").onchange = async () => { if (recording) { syncForm(); return; } cfg.res = $("fRes").value; cfg.bps = Number($("fBps").value); store.set("gdc.camCfg", cfg); if (stream) { try { await openCam(); } catch { /* ok */ } } publish(); };
$("camBtn").onclick = async () => { cfg.autoCam = true; store.set("gdc.camCfg", cfg); syncForm(); try { await openCam(); } catch { /* errore già mostrato */ } };
$("camStop").onclick = () => { cfg.autoCam = false; store.set("gdc.camCfg", cfg); syncForm(); dbg("info", "camera fermata a mano: avvio automatico disattivato"); stopCam(); };
$("fAuto").onchange = () => { cfg.autoCam = $("fAuto").checked; store.set("gdc.camCfg", cfg); dbg("info", `avvio automatico ${cfg.autoCam ? "attivato" : "disattivato"}`); if (cfg.autoCam) autoOpen("opzione attivata"); };
$("recBtn").onclick = () => (recording ? stopRec() : startRec());
$("blackBtn").onclick = () => setStandby(true);
$("blackout").onclick = () => { const n = Date.now(); if (n - lastTapT < 400) setStandby(false); lastTapT = n; };
$("myLink").onclick = () => { if (!pairing) return; copyText(GDC_RT.Pair.link("camera.html", pairing, ID), $("myLink")); };
$("pairBtn").onclick = () => { const p = GDC_RT.Pair.decode($("pairTxt").value); if (!p) { alert("Codice non valido"); return; } GDC_RT.Pair.save(p); location.reload(); };
$("dbgToggle").onclick = () => { dbgOpen = !dbgOpen; $("dbgPre").hidden = !dbgOpen; $("dbgToggle").textContent = dbgOpen ? "Nascondi" : "Mostra"; if (dbgOpen) renderDbg(); };
$("dbgCopy").onclick = () => copyText(`REGISTRO CAMERA ${PAGE_VERSION} · ID ${ID} (${idSrc.src}) · ${new Date().toISOString()}\n` + dbgBuf.map(fmtLine).join("\n"), $("dbgCopy"));

async function start() {
  const nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
  dbg("info", `avvio ${PAGE_VERSION}`, { ua: navigator.userAgent, standalone: navigator.standalone === true, displayMode: matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser", browserVero: /Safari\//.test(navigator.userAgent), schermo: `${screen.width}x${screen.height}@${devicePixelRatio}`, finestra: `${innerWidth}x${innerHeight}`, lingua: navigator.language, fuso: Intl.DateTimeFormat().resolvedOptions().timeZone, core: navigator.hardwareConcurrency, online: navigator.onLine, referrer: document.referrer || "(nessuno)", navigazione: nav ? nav.type : "?", storiaPagine: history.length, mock: MOCK });
  dbg("info", `identità camera: ${ID} (origine: ${idSrc.src})`, { linkId: hashPair?.linkId || null, localStorage: !!store.get("gdc.camId", null), cookie: !!getCookie("gdc_camid"), cookieAbilitati: navigator.cookieEnabled, fp: FP });
  const lsOk = store.set("gdc.test", Date.now()); dbg(lsOk ? "info" : "error", `localStorage ${lsOk ? "ok" : "NON scrivibile"}`);
  try { if (navigator.storage?.persisted) dbg("info", `archivio persistente: ${await navigator.storage.persisted()}`); } catch { /* ok */ }
  pairing = hashPair || (window.GDC_RT && GDC_RT.Pair.load()) || null;
  dbg("info", `abbinamento: ${pairing ? "presente, canale …" + String(pairing.c).slice(-4) + (hashPair ? " (da link)" : " (memorizzato)") : "assente"}`);
  $("pairBox").hidden = !!pairing; $("main").hidden = !pairing; $("statPanel").hidden = !pairing; $("dbgPanel").hidden = false;
  syncForm(); renderStat();
  await db.selfTest(); await loadSessions();
  if (!pairing) return;
  rt = GDC_RT.connect({ pairing, role: "camera", id: ID, meta: { name: cfg.name, device: cfg.device, fp: FP }, mock: MOCK, log: (l, m) => dbg(l, "rt: " + m) });
  rt.onStatus((s) => { $("connTxt").textContent = s; renderStat(); });
  rt.on("cmd", onCmd); rt.on("rtc", onRtc); rt.on("hello", () => { dbg("info", "hello dalla dashboard"); publish(); });
  setInterval(publish, 2000); setInterval(flushDbg, 1500); publish();
  setInterval(() => $("stat").children.length && renderStat(), 1000);
  navigator.mediaDevices?.addEventListener?.("devicechange", () => dbg("info", "dispositivi multimediali cambiati"));
  autoOpen("apertura pagina");
}
start();
</script>
