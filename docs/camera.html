<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera GDC</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --panel-2:#eef0f3; --text:#14161a; --muted:#5f6672; --line:#d9dde3; --ok:#12875a; --bad:#d92d20; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1114; --panel:#181b20; --panel-2:#20242b; --text:#eceef2; --muted:#98a0ad; --line:#2b3038; --ok:#3ccf91; --bad:#ff5a4d; --accent:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:12px max(12px, env(safe-area-inset-left)) 40px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  h1 { font-size: 19px; margin: 4px 0 0; } h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-height: 44px; margin: 0 6px 6px 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.rec { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
  button:disabled { opacity: .45; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; width: 100%; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  video { width: 100%; max-height: 40vh; background: #000; border-radius: 10px; display: block; object-fit: contain; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); } .pill.ok { color: var(--ok); border-color: var(--ok); } .pill.ok .dot { background: var(--ok); } .pill.rec { color: var(--bad); border-color: var(--bad); } .pill.rec .dot { background: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } } @media (prefers-reduced-motion: reduce) { .pill.rec .dot { animation: none; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: 4px 0; border-bottom: 1px dashed var(--line); vertical-align: top; } td:first-child { color: var(--muted); width: 45%; padding-right: 8px; }
  .muted { color: var(--muted); font-size: 13px; } .err { color: var(--bad); font-weight: 600; }
  ol { list-style: none; margin: 0; padding: 0; } ol li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.35; background: var(--panel-2); border-radius: 10px; padding: 8px; margin: 8px 0 0; max-height: 50vh; overflow: auto; }
  #blackout { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 2147483647; display: none; } #blackout.on { display: block; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>Camera</h1><span class="pill" id="connPill"><span class="dot"></span><span id="connTxt">non collegata</span></span></div>
  <div id="modeHost"></div>

  <section class="panel" id="pairBox" hidden>
    <h2>Abbinamento</h2>
    <p class="muted" style="margin-top:0">Apri il link di abbinamento ricevuto, oppure incolla qui il codice che inizia con <b>gdc1.</b></p>
    <textarea id="pairTxt" rows="3" placeholder="gdc1.…"></textarea>
    <button class="primary" id="pairBtn" style="margin-top:8px">Abbina</button>
  </section>

  <section class="panel" id="main" hidden>
    <h2>Questo telefono</h2>
    <div class="row"><div style="flex:1;min-width:130px"><label>Dispositivo<input id="fDev" maxlength="40"></label></div><div style="flex:1;min-width:130px"><label>Nome camera<input id="fName" maxlength="30"></label></div></div>
    <div class="row"><div style="flex:1;min-width:130px"><label>Qualità<select id="fRes"><option value="720p">720p</option><option value="1080p">1080p</option><option value="4K">4K</option></select></label></div>
      <div style="flex:1;min-width:130px"><label>Bitrate video<select id="fBps"><option value="8000000">8 Mbps</option><option value="20000000">20 Mbps</option><option value="40000000">40 Mbps</option></select></label></div></div>
    <button class="primary" id="camBtn">Avvia camera</button><button id="camStop" disabled>Ferma camera</button><button id="blackBtn">Schermo nero</button><button class="adv-only" id="myLink">Copia il mio link</button><button class="adv-only" id="batInfo">Dati per Comandi (batteria)</button><button class="adv-only" id="batTest">Prova invio batteria</button><button class="adv-only" id="zoomTest">Test zoom digitale</button><button class="adv-only" id="spaceTest">Misura spazio reale</button>
    <label style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="fAuto" style="width:auto;min-height:0"> Avvia la camera all'apertura della pagina</label>
    <video id="vid" muted playsinline></video>
  </section>

  <section class="panel" id="statPanel" hidden>
    <h2>Stato</h2>
    <table id="stat"></table>
    <button class="rec adv-only" id="recBtn" disabled style="margin-top:8px">● REC (prova locale)</button>
    <div id="msg" class="muted"></div>
  </section>

  <section class="panel" id="clipPanel" hidden>
    <h2>Registrazioni sul telefono</h2>
    <ol id="clips"></ol>
    <div class="muted" id="clipNote"></div>
  </section>

  <section class="panel adv-only" id="dbgPanel" hidden>
    <h2>Registro attività</h2>
    <button id="dbgToggle">Mostra</button><button id="dbgCopy">Copia tutto</button>
    <pre id="dbgPre" hidden></pre>
  </section>
</main>
<div id="blackout"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="rt.js"></script>
<script src="dev.js"></script>
<script src="xfer.js"></script>
<script>
"use strict";
const PAGE_VERSION = "camera r23";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } } };
const getCookie = (k) => (document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)")) || [])[1] || null;
const setCookie = (k, v) => { try { document.cookie = `${k}=${v}; max-age=31536000; path=/; SameSite=Lax`; } catch { /* cookie bloccati */ } };

/* ===== Registro attività (locale + inviato alla dashboard) ===== */
const LOGMAX = 4000, dbgBuf = [], dbgOut = []; let dbgOpen = false, dbgTimer = 0, rt = null;
const sj = (x) => { try { return typeof x === "string" ? x : JSON.stringify(x); } catch { return String(x); } };
function dbg(level, msg, extra) {
  const line = { t: Date.now(), l: level, m: String(msg) + (extra !== undefined ? " " + sj(extra) : "") };
  dbgBuf.push(line); if (dbgBuf.length > LOGMAX) dbgBuf.shift(); if (window.GDC_DEV) GDC_DEV.push(line.t, level, line.m); dbgOut.push(line); if (dbgOut.length > 600) dbgOut.shift();
  if (dbgOpen && !dbgTimer) dbgTimer = setTimeout(() => { dbgTimer = 0; renderDbg(); }, 400);
}
const fmtLine = (x) => `${new Date(x.t).toISOString().slice(11, 23)} [${x.l}] ${x.m}`;
function renderDbg() { const pre = $("dbgPre"); pre.textContent = dbgBuf.slice(-300).map(fmtLine).join("\n"); pre.scrollTop = pre.scrollHeight; }
function flushDbg() { if (rt && rt.status && /^connesso/.test(rt.status) && dbgOut.length) { const lines = dbgOut.splice(0, 40); rt.send("dbg", { id: ID, lines }); } }
async function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.dataset.o || btn.textContent; btn.dataset.o = o; btn.textContent = "Copiato ✓"; setTimeout(() => (btn.textContent = o), 1500); } };
  try { await navigator.clipboard.writeText(text); done(); return; } catch { /* provo il metodo alternativo */ }
  try { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand("copy"); ta.remove(); if (ok) { done(); return; } } catch { /* ok */ }
  prompt("Copia questo testo", text.slice(0, 20000));
}
addEventListener("error", (e) => { dbg("error", `errore pagina: ${e.message} @${(e.filename || "").split("/").pop()}:${e.lineno}`); });
addEventListener("unhandledrejection", (e) => { dbg("error", `promessa rifiutata: ${e.reason?.name || ""} ${e.reason?.message || e.reason}`); });
document.addEventListener("visibilitychange", () => { dbg("info", `visibilità: ${document.visibilityState}`); if (document.visibilityState === "visible") { if (stream) wakeOn(); db.reset(); loadSessions(); publish(); setTimeout(() => autoOpen("ritorno in primo piano"), 800); } });
addEventListener("pagehide", (e) => dbg("info", `pagehide persisted=${e.persisted}`));
addEventListener("pageshow", (e) => { dbg("info", `pageshow persisted=${e.persisted}`); if (e.persisted) { db.reset(); loadSessions(); publish(); } });
addEventListener("online", () => dbg("info", "rete: online")); addEventListener("offline", () => dbg("warn", "rete: offline"));
document.addEventListener("freeze", () => dbg("warn", "pagina congelata dal browser")); document.addEventListener("resume", () => dbg("info", "pagina ripresa"));

/* ===== Identità della camera ===== */
const hashPair = (window.GDC_RT && GDC_RT.Pair.fromHash()) || null; // legge e consuma il link di abbinamento
const idSrc = (() => {
  const lk = hashPair && hashPair.linkId, ls = store.get("gdc.camId", null), ck = getCookie("gdc_camid");
  if (lk) return { id: lk, src: "link" }; if (ls) return { id: ls, src: "memoria locale" }; if (ck) return { id: ck, src: "cookie" };
  return { id: "cam-" + Math.random().toString(36).slice(2, 8), src: "nuova" };
})();
const ID = idSrc.id; store.set("gdc.camId", ID); setCookie("gdc_camid", ID);
const FP = (() => { const s = [navigator.userAgent, screen.width, screen.height, devicePixelRatio, navigator.hardwareConcurrency, Intl.DateTimeFormat().resolvedOptions().timeZone].join("|"); let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(16); })();
const cfg = Object.assign({ device: /iPhone/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Telefono", name: "cam1", res: "1080p", bps: 20000000, facing: "environment", autoCam: true }, store.get("gdc.camCfg", {}));
{ const qp = new URLSearchParams(location.search); // ?name=...&device=... dal link: nome della camera e del dispositivo
  if (qp.get("name") || qp.get("device")) { if (qp.get("name")) cfg.name = qp.get("name").slice(0, 30); if (qp.get("device")) cfg.device = qp.get("device").slice(0, 40); store.set("gdc.camCfg", cfg); } }
const RES = { "720p": [1280, 720], "1080p": [1920, 1080], "4K": [3840, 2160] };
const MAX_BUF = 700 * 1048576; // limite prudente misurato su iPhone XR con Safari 16 (circa 0,78 GB), usato finché non si misura lo spazio reale
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const MOCK = new URLSearchParams(location.search).has("mock");
const OS = (() => { const m = navigator.userAgent.match(/OS (\d+)[_.](\d+)(?:[_.](\d+))?/); return m ? `iOS ${m[1]}.${m[2]}${m[3] ? "." + m[3] : ""}` : navigator.platform; })();
let joinState = "attesa", joinAt = Date.now();
const joinText = () => joinState === "ok" ? "accettata" : joinState === "no" ? "NON accettata dalla regia: chiedi di rientrare" : (Date.now() - joinAt > 10000 ? "in attesa della risposta della regia (può servire una conferma)" : "collegamento…");
let stream = null, recording = null, standby = false, lastErr = "", pairing = null, lastTapT = 0, storageMode = "indexeddb";
const bat = { level: null, charging: null, at: 0 };
try { if (!localStorage.getItem("gdc.batfix1")) { localStorage.removeItem("gdc.bat." + ID); localStorage.setItem("gdc.batfix1", "1"); } } catch { /* ok */ }
try { const o = JSON.parse(localStorage.getItem("gdc.bat." + ID)); if (o && o.level != null) Object.assign(bat, o); } catch { /* ok */ }
function setBat(level, charging, src) {
  let l = Number(level); if (!isFinite(l)) { dbg("warn", `batteria: valore non valido da ${src}: ${JSON.stringify(level)}`); return false; }
  l = Math.max(0, Math.min(100, Math.round(l)));
  const ch = charging === true || charging === "true" || charging === 1 || charging === "1" ? true : charging === false || charging === "false" || charging === 0 || charging === "0" ? false : null;
  bat.level = l; if (ch !== null) bat.charging = ch; bat.at = Date.now();
  try { localStorage.setItem("gdc.bat." + ID, JSON.stringify(bat)); } catch { /* ok */ }
  dbg("info", `batteria da ${src}: ${l}%${ch === null ? "" : ch ? ", in carica" : ", non in carica"}`); publish(); return true;
}

/* ===== Archivio locale: pezzi della registrazione e registrazioni (IndexedDB, con riapertura automatica) ===== */
const db = (() => {
  let h = null; const mem = { chunks: new Map(), sessions: new Map(), frames: new Map() };
  const open = () => h ? Promise.resolve(h) : new Promise((res, rej) => {
    const r = indexedDB.open("gdc-camera", 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("chunks")) d.createObjectStore("chunks"); if (!d.objectStoreNames.contains("sessions")) d.createObjectStore("sessions", { keyPath: "id" }); if (!d.objectStoreNames.contains("frames")) d.createObjectStore("frames"); };
    r.onsuccess = () => { h = r.result; h.onclose = () => { dbg("warn", "IndexedDB: connessione chiusa dal browser"); h = null; }; h.onversionchange = () => { dbg("warn", "IndexedDB: versionchange"); try { h.close(); } catch { /* ok */ } h = null; }; res(h); };
    r.onerror = () => rej(r.error); r.onblocked = () => dbg("warn", "IndexedDB: apertura bloccata");
  });
  const run = async (fn) => {
    let last;
    for (let i = 0; i < 3; i++) {
      try { return await fn(await open()); }
      catch (e) { last = e; if (i < 2 && ["InvalidStateError", "TransactionInactiveError", "UnknownError", "AbortError"].includes(e.name)) { dbg("warn", `IndexedDB ${e.name} (${e.message}): riapro e riprovo ${i + 1}/2`); try { h && h.close(); } catch { /* ok */ } h = null; await sleep(200 * (i + 1)); continue; } throw e; }
    }
    throw last;
  };
  const rq = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = (t) => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("transazione annullata")); });
  const range = (sid) => IDBKeyRange.bound(sid + ":", sid + ":￿");
  return {
    reset() { try { h && h.close(); } catch { /* ok */ } h = null; },
    async selfTest() {
      const t0 = performance.now();
      try { await run(async (d) => { const t = d.transaction("chunks", "readwrite"); t.objectStore("chunks").put(new Blob(["x"]), "_test"); await done(t); const t2 = d.transaction("chunks", "readwrite"); t2.objectStore("chunks").delete("_test"); await done(t2); }); dbg("info", `archivio IndexedDB ok (${Math.round(performance.now() - t0)} ms)`); storageMode = "indexeddb"; return true; }
      catch (e) { dbg("error", `archivio IndexedDB NON utilizzabile: ${e.name}: ${e.message}`); storageMode = "memoria"; return false; }
    },
    putFrame: (k, b) => storageMode === "memoria" ? Promise.resolve(void mem.frames.set(k, b)) : run(async (d) => { const t = d.transaction("frames", "readwrite"); t.objectStore("frames").put(b, k); await done(t); }),
    frameKeys: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.frames.keys()].filter((k) => k.startsWith(sid + ":")).sort()) : run((d) => rq(d.transaction("frames").objectStore("frames").getAllKeys(range(sid)))),
    getFrame: (k) => storageMode === "memoria" ? Promise.resolve(mem.frames.get(k)) : run((d) => rq(d.transaction("frames").objectStore("frames").get(k))),
    delFrameKeys: (keys) => storageMode === "memoria" ? Promise.resolve(keys.forEach((k) => mem.frames.delete(k))) : run(async (d) => { const t = d.transaction("frames", "readwrite"), st = t.objectStore("frames"); keys.forEach((k) => st.delete(k)); await done(t); }),
    delFrames: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.frames.keys()].filter((k) => k.startsWith(sid + ":")).forEach((k) => mem.frames.delete(k))) : run(async (d) => { const t = d.transaction("frames", "readwrite"); t.objectStore("frames").delete(range(sid)); await done(t); }),
    putChunk: (k, b) => storageMode === "memoria" ? Promise.resolve(void mem.chunks.set(k, b)) : run(async (d) => { const t = d.transaction("chunks", "readwrite"); t.objectStore("chunks").put(b, k); await done(t); }),
    chunkKeys: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.chunks.keys()].filter((k) => k.startsWith(sid + ":")).sort()) : run((d) => rq(d.transaction("chunks").objectStore("chunks").getAllKeys(range(sid)))),
    getChunk: (k) => storageMode === "memoria" ? Promise.resolve(mem.chunks.get(k)) : run((d) => rq(d.transaction("chunks").objectStore("chunks").get(k))),
    putSession: (o) => storageMode === "memoria" ? Promise.resolve(void mem.sessions.set(o.id, o)) : run(async (d) => { const t = d.transaction("sessions", "readwrite"); t.objectStore("sessions").put(o); await done(t); }),
    sessions: () => storageMode === "memoria" ? Promise.resolve([...mem.sessions.values()]) : run((d) => rq(d.transaction("sessions").objectStore("sessions").getAll())),
    chunks: (sid) => storageMode === "memoria" ? Promise.resolve([...mem.chunks.entries()].filter(([k]) => k.startsWith(sid + ":")).sort((a, b) => (a[0] < b[0] ? -1 : 1)).map((x) => x[1])) : run((d) => rq(d.transaction("chunks").objectStore("chunks").getAll(range(sid)))),
    delSession: (sid) => storageMode === "memoria" ? Promise.resolve((mem.sessions.delete(sid), [...mem.chunks.keys()].filter((k) => k.startsWith(sid + ":")).forEach((k) => mem.chunks.delete(k)))) : run(async (d) => { const t = d.transaction(["chunks", "sessions", "frames"], "readwrite"); t.objectStore("chunks").delete(range(sid)); t.objectStore("frames").delete(range(sid)); t.objectStore("sessions").delete(sid); await done(t); }),
  };
})();
let sessions = [];
const bufBytes = () => sessions.filter((s) => s.status !== "inviata").reduce((a, s) => a + (s.bytes || 0), 0) + (recording && !sessions.some((s) => s.id === recording.sid) ? recording.bytes : 0) + (tl ? tl.bytes : 0);
async function loadSessions() {
  try { sessions = (await db.sessions()).sort((a, b) => b.start - a.start); if (lastErr.startsWith("Archivio")) lastErr = ""; dbg("info", `registrazioni nell'archivio: ${sessions.length}`); }
  catch (e) { lastErr = "Archivio non disponibile: " + e.name; dbg("error", `lettura archivio fallita: ${e.name}: ${e.message}`); }
  renderClips();
}

/* ===== Spazio: quanto si può ancora registrare, avvisi, arresto sicuro e liberazione facoltativa ===== */
const RESERVE = 200 * 1048576, SPACE = { quota: null, usage: null, at: 0, measuredMB: store.get("gdc.spaceMeasured", null), level: "ok", freed: 0 };
const bytesPerMin = () => (Number(cfg.bps) + 128000) / 8 * 60;
const storedBytes = () => sessions.reduce((a, s) => a + (s.bytes || 0), 0) + (recording && !sessions.some((s) => s.id === recording.sid) ? recording.bytes : 0) + (tl ? tl.bytes : 0);
async function spaceRefresh() {
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); SPACE.quota = e.quota; SPACE.usage = e.usage; } } catch { /* ok */ }
  SPACE.at = Date.now();
}
function spaceInfo() {
  const used = storedBytes(); let avail = Infinity; const basis = [];
  if (SPACE.quota != null && SPACE.usage != null) { avail = Math.min(avail, SPACE.quota - SPACE.usage - RESERVE); basis.push("quota del browser"); }
  const cap = SPACE.measuredMB ? SPACE.measuredMB * 1048576 * 0.9 : (IS_IOS || SPACE.quota == null ? MAX_BUF : null); // senza misura: limite prudente su iOS e dove il browser non stima la quota
  if (cap != null) { avail = Math.min(avail, cap - used); basis.push(SPACE.measuredMB ? "limite misurato" : "limite prudente"); }
  if (!isFinite(avail)) return { known: false, used, basis: "non misurabile" };
  avail = Math.max(0, avail); const budget = used + avail, pct = budget ? used / budget : 0, minLeft = avail / bytesPerMin();
  const level = pct >= 0.95 || minLeft < 5 ? "crit" : pct >= 0.8 || minLeft < 15 ? "warn" : "ok";
  return { known: true, used, avail, budget, pct, minLeft, level, basis: basis.join(" + ") };
}
function spaceState() {
  const i = spaceInfo(), o = { known: i.known, autoFree: !!cfg.autoFree, measuredMB: SPACE.measuredMB, freedMB: Math.round(SPACE.freed / 1048576), quotaMB: SPACE.quota != null ? Math.round(SPACE.quota / 1048576) : null, usageMB: SPACE.usage != null ? Math.round(SPACE.usage / 1048576) : null, usedMB: Math.round(i.used / 1048576), basis: i.basis };
  if (i.known) Object.assign(o, { availMB: Math.round(i.avail / 1048576), minLeft: Math.floor(i.minLeft), level: i.level, pct: Math.round(i.pct * 100) });
  return o;
}
const spaceText = () => { const i = spaceInfo(); return i.known ? `<span class="${i.level === "ok" ? "" : "err"}">circa ${Math.floor(i.minLeft)} min (${Math.round(i.avail / 1048576)} MB)</span>` : "non misurabile"; };
// elimina le clip più vecchie già trasferite e verificate (stato "inviata"), mai le altre
async function spaceFree(targetBytes) {
  const done = sessions.filter((s) => s.status === "inviata").sort((a, b) => a.start - b.start); let freedNow = 0;
  for (const s of done) {

/* ===== Anteprima WebRTC verso la dashboard ===== */
const pcs = {};
const plain = (d) => ({ type: d.type, sdp: d.sdp });
function closePreviews() { for (const k in pcs) { try { clearInterval(pcs[k].statT); pcs[k].pc.close(); } catch { /* ok */ } delete pcs[k]; } }
async function rtcStats(pc, tag) {
  try {
    const r = await pc.getStats(), out = { tag }; let pair = null; const cands = {};
    r.forEach((x) => { if (x.type === "outbound-rtp" && x.kind === "video") Object.assign(out, { inviati: x.framesEncoded, larg: x.frameWidth, alt: x.frameHeight, fps: x.framesPerSecond, bytes: x.bytesSent, limite: x.qualityLimitationReason }); if (x.type === "candidate-pair" && (x.nominated || x.selected) && x.state === "succeeded") pair = x; if (x.type === "local-candidate" || x.type === "remote-candidate") cands[x.id] = x.candidateType; });
    if (pair) Object.assign(out, { coppia: `${cands[pair.localCandidateId] || "?"}→${cands[pair.remoteCandidateId] || "?"}`, rtt_ms: pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null });
    dbg("info", "WebRTC statistiche", out);
  } catch (e) { dbg("warn", `statistiche WebRTC: ${e.message}`); }
}
async function applyPreviewParams(pc, q) {
  const mini = q === "mini";
  for (const sender of pc.getSenders()) {
    if (!sender.track || sender.track.kind !== "video") continue;
    const scale = Math.max(1, (sender.track.getSettings().height || 1920) / (mini ? 360 : 720));
    for (const withFps of mini ? [true, false] : [false]) {
      try { const p = sender.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}]; p.encodings[0].maxBitrate = mini ? 500000 : 1500000; p.encodings[0].scaleResolutionDownBy = scale; if (withFps) p.encodings[0].maxFramerate = 15; await sender.setParameters(p); dbg("info", "parametri invio anteprima applicati", { qualita: q, maxBitrate: p.encodings[0].maxBitrate, scala: +scale.toFixed(2), maxFramerate: withFps ? 15 : "non impostato" }); break; }
      catch (e) { dbg("warn", `setParameters (${q}${withFps ? " con fps" : ""}): ${e.name}: ${e.message}`); }
    }
  }
}
async function startPreview(dashId, q) {
  if (!stream || !rt) { lastErr = "Anteprima: avvia prima la camera"; dbg("warn", "preview_start senza camera"); publish(); return; }
  try { clearInterval(pcs[dashId]?.statT); pcs[dashId]?.pc.close(); } catch { /* ok */ }
  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }); pcs[dashId] = { pc, pending: [], statT: 0 }; dbg("info", `anteprima ${q || "full"} verso ${dashId}: creo la connessione WebRTC`);
  pc.onconnectionstatechange = () => { dbg("info", `WebRTC connessione: ${pc.connectionState}`); if (pc.connectionState === "connected") { const e = pcs[dashId]; if (e) { clearInterval(e.statT); e.statT = setInterval(() => rtcStats(pc, "10s"), 10000); setTimeout(() => rtcStats(pc, "avvio"), 2500); } } };
  pc.oniceconnectionstatechange = () => dbg("info", `WebRTC ICE: ${pc.iceConnectionState}`); pc.onsignalingstatechange = () => dbg("info", `WebRTC signaling: ${pc.signalingState}`); pc.onicegatheringstatechange = () => dbg("info", `WebRTC raccolta ICE: ${pc.iceGatheringState}`);
  stream.getVideoTracks().forEach((t) => pc.addTrack(t, stream));
  let nc = 0; pc.onicecandidate = (e) => { if (e.candidate) { nc++; rt.send("rtc", { to: dashId, from: ID, kind: "cand", data: e.candidate.toJSON() }); } else dbg("info", `candidati ICE inviati: ${nc}`); };
  await pc.setLocalDescription(await pc.createOffer()); await applyPreviewParams(pc, q);
  rt.send("rtc", { to: dashId, from: ID, kind: "offer", data: plain(pc.localDescription) }); dbg("info", "offerta WebRTC inviata");
}
async function onRtc(m) {
  if (m.to !== ID) return; const e = pcs[m.from]; if (!e) { dbg("warn", `segnale rtc ${m.kind} senza connessione attiva`); return; }
  try {
    if (m.kind === "answer") { await e.pc.setRemoteDescription(m.data); dbg("info", "risposta WebRTC ricevuta"); for (const c of e.pending.splice(0)) await e.pc.addIceCandidate(c).catch(() => {}); }
    else if (m.kind === "cand") { if (e.pc.remoteDescription) e.pc.addIceCandidate(m.data).catch((x) => dbg("warn", `candidato ICE rifiutato: ${x.message}`)); else e.pending.push(m.data); }
  } catch (x) { dbg("error", `segnale rtc ${m.kind}: ${x.name}: ${x.message}`); }
}

/* ===== Trasferimento file verso la dashboard ===== */
let xferBusy = null;
const xferFail = (m, err) => { try { rt?.send("xdone", { id: ID, xid: m.xid, sid: m.sid || null, ok: false, error: err }); } catch { /* ok */ } throw new Error(err); };
function xferRun(m, { name, mime, size, source, sid, test }) {
  const handle = {}; xferBusy = { sid: sid || "prova", xid: m.xid, pct: 0, abort: () => handle.abort && handle.abort() }; publish();
  GDC_XFER.sendFile({ rt, from: ID, to: m.from, xid: m.xid, name, mime, size, source, handle, log: (l, t) => dbg(l, t),
    onProgress: (p) => { xferBusy.pct = size ? Math.min(100, Math.round(p.sent / size * 100)) : 0; } })
    .then(async (r) => {
      dbg("info", `trasferimento riuscito: ${name}`, { MB: +(r.bytes / 1048576).toFixed(1), Mbps: +r.mbps.toFixed(2), secondi: Math.round(r.ms / 1000) });
      rt.send("xdone", { id: ID, xid: m.xid, sid: sid || null, ok: true, bytes: r.bytes, mbps: r.mbps });
      if (!test) {
        const s = sessions.find((x) => x.id === sid);
        if (m.del) { await db.delSession(sid); dbg("info", `registrazione ${sid} eliminata dal telefono dopo la verifica`); await loadSessions(); }
        else if (s) { s.status = "inviata"; s.sentAt = Date.now(); await db.putSession(s); renderClips(); }
      }
    })
    .catch((e) => { lastErr = "Trasferimento: " + e.message; dbg("error", `trasferimento fallito: ${e.message}`); try { rt.send("xdone", { id: ID, xid: m.xid, sid: sid || null, ok: false, error: e.message }); } catch { /* ok */ } })
    .finally(() => { xferBusy = null; publish(); });
}
async function xferStart(m) {
  if (!rt || !m.xid || !m.from) throw new Error("richiesta di trasferimento incompleta");
  if (xferBusy && xferBusy.sid === m.sid) { dbg("info", "nuovo tentativo per la stessa registrazione: interrompo il precedente"); xferBusy.abort(); for (let i = 0; i < 80 && xferBusy; i++) await sleep(100); }
  if (xferBusy) xferFail(m, "un altro trasferimento è già in corso");
  const s = sessions.find((x) => x.id === m.sid); if (!s) xferFail(m, "registrazione non trovata sul telefono");
  if (recording && recording.sid === s.id) xferFail(m, "registrazione ancora in corso");
  const keys = await db.chunkKeys(s.id); if (!keys.length) xferFail(m, "nessun dato nella registrazione");
  const ext = /mp4/.test(s.mime || "") ? "mp4" : /webm/.test(s.mime || "") ? "webm" : "mp4";
  let i = 0, rest = null;
  const source = {
    next: async () => { if (rest) { const r = rest; rest = null; return r; } if (i >= keys.length) return null; const b = await db.getChunk(keys[i++]); return b ? await b.arrayBuffer() : null; },
    // ripresa: calcola il CRC32 dei primi `off` byte e si posiziona subito dopo
    skipTo: async (off) => { let crc = 0, left = off; i = 0; rest = null; while (left > 0) { if (i >= keys.length) throw new Error("ripresa oltre la fine del file"); const b = await db.getChunk(keys[i++]); const u8 = new Uint8Array(await b.arrayBuffer()); if (u8.length <= left) { crc = GDC_XFER.crc32(u8, crc); left -= u8.length; } else { crc = GDC_XFER.crc32(u8.subarray(0, left), crc); rest = u8.subarray(left); left = 0; } } return crc; },
  };

  xferRun(m, { name: `${cfg.name}_${s.id}.${ext}`, mime: s.mime, size: s.bytes || 0, source, sid: s.id });

}
async function xferTest(m) {

/* ===== Comandi dalla dashboard ===== */
async function onCmd(m) {
  if (m.to !== ID && m.to !== "*") return;
  dbg("info", `comando ricevuto: ${m.cmd}`, m);
  let ok = true, detail = null;
  try {
    switch (m.cmd) {
      case "join_result": joinState = m.ok ? "ok" : "no"; dbg(m.ok ? "info" : "warn", m.ok ? "la regia ha accettato questa camera" : "la regia NON ha accettato questa camera: invio dello stato sospeso"); if (m.ok) publish(); else renderStat(); detail = { join: joinState }; break;
      case "rec_start": await startRec(); ok = !!recording; detail = ok ? "registrazione avviata" : lastErr || "non avviata"; break;
      case "rec_stop": stopRec(); detail = "stop richiesto"; break;
      case "standby": setStandby(!!m.on); detail = { standby }; break;
      case "config": if (!recording) { if (m.res && RES[m.res]) cfg.res = m.res; if (m.bps) cfg.bps = Number(m.bps); store.set("gdc.camCfg", cfg); syncForm(); if (stream) { try { await openCam(); } catch { ok = false; } } publish(); detail = { res: cfg.res, bps: cfg.bps }; } else { lastErr = "Impostazioni non applicate: registrazione in corso"; ok = false; detail = lastErr; publish(); } break;
      case "rename": if (m.name) cfg.name = m.name; if (m.device) cfg.device = m.device; store.set("gdc.camCfg", cfg); syncForm(); rt?.setMeta({ name: cfg.name, device: cfg.device }); publish(); detail = { name: cfg.name, device: cfg.device }; break;
      case "tl_start": ok = await tlStart(m); detail = ok ? "time-lapse avviato" : lastErr || "non avviato"; break;
      case "tl_stop": tlStop(); detail = "stop richiesto"; break;
      case "preview_start": await startPreview(m.from, m.q); detail = "offerta inviata"; break;
      case "preview_stop": try { clearInterval(pcs[m.from]?.statT); pcs[m.from]?.pc.close(); } catch { /* ok */ } delete pcs[m.from]; detail = "chiusa"; break;
      case "zoom": detail = await setZoom(m.z); break;
      case "space_cfg": cfg.autoFree = !!m.autoFree; store.set("gdc.camCfg", cfg); dbg("info", `spazio: liberazione automatica delle clip verificate ${cfg.autoFree ? "attivata" : "spenta"}`); spaceTick(); publish(); detail = { autoFree: cfg.autoFree }; break;
      case "xfer_start": detail = await xferStart(m); break;
      case "xfer_test": detail = await xferTest(m); break;
      case "battery": ok = setBat(m.level, m.charging, "dashboard"); detail = ok ? bat : "valore non valido"; break;
      default: ok = false; detail = "comando sconosciuto"; break;
    }
  } catch (e) { ok = false; detail = `${e.name}: ${e.message}`; dbg("error", `comando ${m.cmd} fallito: ${detail}`); }
  rt?.send("ack", { id: ID, cmd: m.cmd, rid: m.rid || null, ok, detail, ts: Date.now() });
}

async function start() {

  dbg("info", `abbinamento: ${pairing ? "presente, canale …" + String(pairing.c).slice(-4) + (hashPair ? " (da link)" : " (memorizzato)") : "assente"}`);
  if (window.GDC_DEV) GDC_DEV.init({ role: "camera", dev: () => ID, ver: PAGE_VERSION, pairing, log: (l, m) => dbg(l, m), backlog: () => dbgBuf.slice(-300), host: $("modeHost") });
  batProbe(); deviceProbe().catch((e) => dbg("warn", `sonda dispositivo: ${e.name}: ${e.message}`));
  $("pairBox").hidden = !!pairing; $("main").hidden = !pairing; $("statPanel").hidden = !pairing; $("dbgPanel").hidden = false;
  syncForm(); renderStat();
  await db.selfTest(); await loadSessions();
  spaceTick(); setInterval(spaceTick, 8000);
  if (!pairing) return;
  rt = GDC_RT.connect({ pairing, role: "camera", id: ID, meta: { name: cfg.name, device: cfg.device, fp: FP }, mock: MOCK, log: (l, m) => dbg(l, "rt: " + m) });
  rt.onStatus((s) => { $("connTxt").textContent = s; renderStat(); });
  rt.on("battery", (m) => { if (m && m.test) { dbg("info", "prova di invio ricevuta dal canale: valore di prova, non salvato"); return; } if (m && (!m.id || m.id === ID)) setBat(m.level, m.charging, "Comandi"); else dbg("trace", `batteria ignorata (id ${m && m.id})`); }); rt.on("xrtc", (m) => { if (m && m.to === ID) GDC_XFER.signal(m); }); rt.on("cmd", onCmd); rt.on("rtc", onRtc); rt.on("hello", () => { dbg("info", "hello dalla dashboard"); publish(); });
  setInterval(publish, 2000); setInterval(flushDbg, 1500); publish();
  setInterval(() => $("stat").children.length && renderStat(), 1000);
  navigator.mediaDevices?.addEventListener?.("devicechange", () => dbg("info", "dispositivi multimediali cambiati"));
  autoOpen("apertura pagina");
}
start();
</script>
